name: Dev build

# Publishes a build of the current code on the Releases page, as a
# pre-release named "SLAP dev build": every platform's installers and its
# portable binary (the app ready to run from a folder, nothing installed),
# with their checksums.
#
# There is one dev build at a time. Each run publishes a new one, tagged
# dev-<commit>, and then deletes the one before it, release and tag, so the
# Releases page keeps one dev build beside the real releases. A dev build
# is a pre-release, never "Latest", and its tag does not start with v, so
# release.yml never sees it. Real releases still come from release.yml.
#
# Run it by hand from the Actions tab. The "Use workflow from" branch is the
# code that is built, at the commit it pointed to when the run started. Not
# on every push, for the reason desktop.yml is not: four platforms of real
# runner minutes, two of them macOS. A run publishes only if every platform
# it was asked for built; otherwise the previous dev build stays as it was.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build (the dev build then has only those)
        type: choice
        default: all
        options:
          - all
          - windows
          - macos          # both Macs
          - macos-arm64    # Apple Silicon only
          - macos-x64      # Intel only
          - linux

permissions:
  contents: read

# One dev build at a time, from any branch: a newer run replaces one still
# going, and two runs can never delete each other's release.
concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read
    with:
      # The commit, not the branch: every platform builds the same code
      # even if the branch moves while the run is going.
      ref: ${{ github.sha }}
      platforms: ${{ inputs.platforms }}
      # Each platform's artifact only carries its files to the publish job.
      retention-days: 1

  publish:
    name: Publish the dev build
    # Runs only when every platform asked for built.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # to create the release and its tag, and delete the old ones
    steps:
      - name: Read the version
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: desktop/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: Download each platform's build
        uses: actions/download-artifact@v8
        with:
          pattern: SLAP-desktop-*
          path: builds

      - name: Collect the files and write the notes
        id: collect
        shell: bash
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          PICKED: ${{ inputs.platforms }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          short=${SHA::7}
          tag="dev-${short}"
          mkdir release

          # Release files sit side by side, so each name must be unique, and
          # each says it is a dev build: SLAP_0.1.0_x64-setup.exe becomes
          # SLAP_0.1.0-dev.abc1234_x64-setup.exe, never to be mistaken for
          # the 0.1.0 release's file once downloaded.
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            name=${name/#"SLAP_${version}_"/"SLAP_${version}-dev.${short}_"}
            if [ -e "release/$name" ]; then
              echo "::error::Two builds produced $name."
              exit 1
            fi
            cp "$file" "release/$name"
          done < <(find builds -type f -print0)
          if [ -z "$(ls -A release)" ]; then
            echo "::error::No platform produced a build."
            exit 1
          fi
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          ls -l release

          # A table row for each file matching a pattern.
          row() {
            local file
            for file in release/$1; do
              # The backticks are Markdown's, for the file name, not a command.
              # shellcheck disable=SC2016
              if [ -e "$file" ]; then printf '| %s | %s | `%s` |\n' "$2" "$3" "${file#release/}"; fi
            done
          }
          # The backticks below are Markdown's, for code, not commands.
          # shellcheck disable=SC2016
          {
            echo "A build of [\`${short}\`](${REPO_URL}/commit/${SHA}) on \`${BRANCH}\`, made $(date -u '+%Y-%m-%d %H:%M') UTC, for trying out the current code. **Not a release**: the current release is the one marked Latest. The next dev build replaces this one."
            echo
            if [ "$PICKED" != "all" ]; then
              echo "> This run built only: **${PICKED}**."
              echo
            fi
            echo "## Downloads"
            echo
            echo "| For | Kind | File |"
            echo "|---|---|---|"
            row '*-setup.exe' 'Windows 10 or 11 (64-bit)' 'Installer'
            row '*.msi' 'Windows' 'Installer for managed installs (MSI)'
            row '*windows-x64-portable.zip' 'Windows' 'Portable: unzip, run `SLAP\slap-desktop.exe`'
            row '*aarch64.dmg' 'Mac with Apple Silicon' 'Disk image: drag SLAP into Applications'
            row '*macos-arm64.app.zip' 'Mac with Apple Silicon' 'Portable: unzip, open `SLAP.app`'
            row '*x64.dmg' 'Mac with an Intel processor' 'Disk image: drag SLAP into Applications'
            row '*macos-x64.app.zip' 'Mac with an Intel processor' 'Portable: unzip, open `SLAP.app`'
            row '*.AppImage' 'Linux (64-bit)' 'AppImage: `chmod +x` it, then run it'
            row '*.deb' 'Debian or Ubuntu (64-bit)' 'Package: `sudo apt install ./` followed by its name'
            row '*linux-x64-portable.tar.gz' 'Linux (64-bit)' 'Portable: extract, run `SLAP/bin/slap-desktop`'
            echo
            echo "A portable copy runs from its folder with nothing installed, and uses the same settings and database as an installed SLAP. The Windows one needs Microsoft Edge WebView2 (part of Windows 11); the Linux one needs WebKitGTK 4.1 (\`libwebkit2gtk-4.1-0\`). \`SHA256SUMS.txt\` lists each file's checksum."
            echo
            echo "These builds are not code-signed:"
            echo
            echo "- **Windows**: if SmartScreen says \"Windows protected your PC\", choose **More info**, then **Run anyway**."
            echo "- **Mac**: open SLAP once, then go to **System Settings → Privacy & Security** and choose **Open Anyway** (on macOS 14 and earlier, Control-click SLAP and choose **Open**). If macOS says SLAP is damaged, run \`xattr -dr com.apple.quarantine /Applications/SLAP.app\` once in Terminal."
          } > notes.md
          cat notes.md

          {
            echo "tag=$tag"
            echo "title=SLAP dev build ${version} (${short})"
          } >> "$GITHUB_OUTPUT"

      # The new dev build is published before the old one is deleted, so
      # the Releases page is never without one. gh creates the release as a
      # draft, uploads every file, and only then publishes it.
      - name: Publish, then remove the previous dev build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.collect.outputs.tag }}
          TITLE: ${{ steps.collect.outputs.title }}
        run: |
          set -euo pipefail
          # The same commit built again: its dev build is replaced.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" release/* \
            --target "$SHA" --title "$TITLE" --notes-file notes.md \
            --prerelease --latest=false

          # Every other dev build goes, release and tag. Only pre-releases
          # tagged dev-, so a real release can never match.
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.prerelease and (.tag_name | startswith("dev-"))) | .tag_name' |
            while IFS= read -r old; do
              if [ "$old" != "$TAG" ]; then
                echo "Removing the previous dev build $old."
                gh release delete "$old" --cleanup-tag --yes
              fi
            done

          url=$(gh release view "$TAG" --json url --jq '.url')
          echo "Published $TITLE: $url"
          echo "Published [$TITLE]($url)." >> "$GITHUB_STEP_SUMMARY"
