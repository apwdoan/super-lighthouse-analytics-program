name: Build distributables

# Deliberately NOT on every push. Each platform produces a ~400MB artifact
# and takes 10-15 minutes; building four of those per commit burns Actions
# minutes and storage for no benefit. Tag a release, or run it by hand.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        default: all
        options:
          - all
          - windows
          - macos          # both Macs
          - macos-arm64    # Apple Silicon only
          - macos-x64      # Intel only
          - linux
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Point Playwright at the build's staging directory for the WHOLE job, so
  # the browser is downloaded once and reused. Without this the test step
  # and packaging/build.py each fetch their own ~170MB copy.
  #
  # Consequence worth knowing: stage_chromium() then finds a browser already
  # present and skips its install branch, which is why pruning the headless
  # shell sits OUTSIDE that branch in build.py.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/packaging/staging/browsers

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # A Chromium download plus PyInstaller over ~1GB is not fast, and a
    # hung browser download should not burn a full hour.
    timeout-minutes: 45

    strategy:
      # One platform failing should not cancel the others; a Windows-only
      # break still leaves usable macOS and Linux artifacts.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            wanted: windows
            family: windows

          # macos-latest is Apple Silicon (3 CPU / 7GB).
          - os: macos-latest
            label: macos-arm64
            wanted: macos-arm64
            family: macos

          # Intel. NOT macos-13: that image was retired on 2025-12-04 and
          # `runs-on: macos-13` now fails outright. macos-15-intel is the
          # standard replacement (4 CPU / 14GB, so if anything faster than
          # the arm64 runner) and is available until August 2027, after
          # which Actions drops x86_64 entirely. macos-26-intel also exists;
          # 15 is deliberate, on the same "build on the oldest system you
          # need to support" reasoning as the glibc note for Linux.
          - os: macos-15-intel
            label: macos-x64
            wanted: macos-x64
            family: macos

          - os: ubuntu-latest
            label: linux-x64
            wanted: linux
            family: linux

    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # One place that decides whether this platform is being built.
      #
      # The condition was previously repeated on four separate steps, and
      # adding a matrix entry meant editing all four correctly or getting
      # a job that tests and then silently uploads nothing.
      #
      # Values go through env rather than being interpolated into the
      # script. `platforms` is a `choice` so GitHub constrains it, but a
      # workflow that interpolates event data into a shell is the wrong
      # habit to leave lying around for the next person to copy.
      # ----------------------------------------------------------------
      - name: Decide whether to build this platform
        id: gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PICKED: ${{ inputs.platforms }}
          WANTED: ${{ matrix.wanted }}
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "workflow_dispatch" ] \
             || [ "$PICKED" = "all" ] \
             || [ "$PICKED" = "$WANTED" ] \
             || [ "$PICKED" = "$FAMILY" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building $WANTED."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the build for $WANTED (picked: $PICKED)."
            echo "The test suite still runs, which is the point of not"
            echo "gating the whole job."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12 rather than 3.13: widest wheel availability across
          # playwright, pypdf and uvicorn. The app itself supports 3.11+.
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Build-time only, for `npm install` of the Lighthouse worker.
          # The SHIPPED runtime is Playwright's bundled Node, version-checked
          # by build.py.
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # dev AND all: `all` is the runtime extras (playwright, pypdf,
          # fastapi, uvicorn) and carries no test tooling. Installing only
          # `all` is what made the first run die with "No module named pytest".
          python -m pip install -e ".[dev,all]"
          python -m pip install pyinstaller

      - name: Install browsers
        run: python -m playwright install chromium

      # ----------------------------------------------------------------
      # `working-directory`, NOT `npm install --prefix`.
      #
      # The --prefix form worked on the Linux and macOS runners and failed
      # on Windows, where npm ignored the prefix and read the repository
      # root's package.json instead:
      #
      #   npm error path D:\a\...\Super-Lighthouse-Analytics-Project\package.json
      #   npm error enoent Could not read package.json
      #
      # There is no root package.json and there should not be; this is a
      # Python project with one vendored Node worker. `working-directory`
      # is resolved by the Actions runner rather than by npm, so it behaves
      # identically everywhere. packaging/build.py already had this right:
      # it passes cwd= to the subprocess and never used --prefix.
      # ----------------------------------------------------------------
      - name: Install the Lighthouse worker
        working-directory: src/slap/node_worker
        run: npm install --omit=dev --no-audit --no-fund

      # Runs on every platform in the matrix regardless of what is being
      # built, because "does the test suite pass on Intel macOS" is worth
      # knowing even on a run that only ships the arm64 zip.
      # QT_QPA_PLATFORM=offscreen used to be required here. PySide6 is gone;
      # the front-end is a browser and the tests drive it through FastAPI's
      # TestClient, which needs no display of any kind.
      - name: Run the test suite
        run: python -m pytest -q

      # --require-vulndb makes a network failure fail the JOB rather than
      # silently fall back to the copy committed in the repo. A developer
      # building on a train should still get a bundle; a release must never
      # ship data older than the tag it is named after. build.py also
      # refuses a database that came back quietly smaller than the previous
      # one, which is what a rate-limited OSV burst looks like.
      - name: Build the distributable
        if: steps.gate.outputs.build == 'true'
        run: python packaging/build.py --zip --require-vulndb

      # ----------------------------------------------------------------
      # Run the bundle that was just built.
      #
      # `doctor` alone is not enough: it once reported PDF export healthy on
      # a bundle whose export failed, because it stat-ed a different binary
      # than Playwright launches. So this runs a real Lighthouse audit and a
      # real PDF export, against the repo's own offline fixture rather than
      # a live site, so a network hiccup cannot look like a broken build.
      # ----------------------------------------------------------------
      - name: Verify the bundle
        if: steps.gate.outputs.build == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP="$PWD/dist/SLAP.app/Contents/MacOS/SLAP"
          else
            APP="$PWD/dist/SLAP/SLAP"
          fi

          # The arch the bundle actually contains, not the arch the label
          # claims. A silently-Rosetta'd toolchain would produce an x86_64
          # bundle from the arm64 job and nothing else here would notice.
          file "$APP" || true

          python -m tests.fixture_server 8899 > /dev/null 2>&1 &
          FIXTURE=$!
          SERVER=""
          trap 'kill $FIXTURE $SERVER 2>/dev/null || true' EXIT
          sleep 3

          OUT="$RUNNER_TEMP/verify"
          mkdir -p "$OUT" "$RUNNER_TEMP/clean"

          # env -i proves nothing leaks in from the build environment: no
          # node on PATH, no PLAYWRIGHT_BROWSERS_PATH, no site-packages.
          CLEAN="env -i PATH=/usr/bin:/bin HOME=$RUNNER_TEMP/clean"

          # `doctor` exits 1 when ANY backend is missing, and CI has no
          # CrUX key, so its exit code cannot be the gate. Assert on the
          # backends a BUNDLE is responsible for instead.
          DOCTOR="$($CLEAN "$APP" --cli doctor || true)"
          echo "$DOCTOR"
          echo "$DOCTOR" | grep -q '\[ok \] Lighthouse lab data'
          echo "$DOCTOR" | grep -q '\[ok \] PDF export'
          # A bundle with no vulnerability database starts fine, audits
          # fine, and reports zero known vulnerabilities forever, which
          # looks exactly like a clean result. Same class of lie as the PDF
          # check that stat-ed a file instead of launching the browser.
          echo "$DOCTOR" | grep -q '\[ok \] Vulnerability database'

          # And assert it resolves INSIDE the bundle. A database picked up
          # from the build machine's home directory would pass the line
          # above and ship nothing.
          VULNDB="$($CLEAN "$APP" --cli vulndb status)"
          echo "$VULNDB"
          echo "$VULNDB" | grep -q 'npm: OSV.dev'
          case "$VULNDB" in
            *"$PWD/dist"*) : ;;
            *) echo "the bundle resolved a vulnerability database outside itself" >&2
               exit 1 ;;
          esac

          # Every path doctor prints must be inside the bundle. `env -i`
          # should already make borrowing the build machine's browser
          # impossible; assert it rather than trust it, because the Windows
          # step made exactly that mistake and still reported success.
          if echo "$DOCTOR" | grep -q 'packaging/staging'; then
            echo "doctor resolved a path in packaging/staging: not self-contained" >&2
            exit 1
          fi

          # ----------------------------------------------------------
          # Everything below drives the bundled WEB SERVER, because that is
          # what a teammate gets when they double-click the app. The CLI is
          # the secondary path now.
          #
          # This is the check that would have caught uvicorn's dynamic
          # imports: it resolves its event loop, HTTP protocol and lifespan
          # implementations by STRING at runtime, so a bundle missing them
          # starts perfectly and dies on the first request. `doctor` alone
          # would never notice.
          # ----------------------------------------------------------
          $CLEAN "$APP" --no-browser --port 8898 --db "$OUT/v.sqlite3" \
            > "$OUT/server.log" 2>&1 &
          SERVER=$!
          trap 'kill $FIXTURE $SERVER 2>/dev/null || true' EXIT

          # free_port() moves to an OS-assigned port if 8898 is taken, so
          # read the URL the server actually printed rather than assuming.
          # `|| true` is not defensive noise. Under `set -euo pipefail` a
          # grep that matches nothing exits 1, pipefail propagates it, and
          # the failing assignment kills the script on the FIRST iteration,
          # before the server has had a chance to write anything. That is
          # exactly what happened the first time this ran.
          URL=""
          for _ in $(seq 1 30); do
            URL=$(grep -o 'http://127.0.0.1:[0-9]*/' "$OUT/server.log" | head -1 || true)
            if [ -n "$URL" ] && curl -fsS "${URL}healthz" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          [ -n "$URL" ] || { echo "server never printed a URL:"; cat "$OUT/server.log"; exit 1; }
          echo "bundled server at $URL"

          for path in "" findings healthz; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${URL}${path}")
            echo "  GET /${path} -> $code"
            [ "$code" = "200" ] || { cat "$OUT/server.log"; exit 1; }
          done

          # A real Lighthouse audit, started the way the operator starts one.
          curl -fsS -X POST -o /dev/null \
            -d 'urls=http://127.0.0.1:8899/index.html&lighthouse=1' "${URL}audit"

          # Poll rather than sleep a fixed time: a Lighthouse run is 30-40s
          # on a fast machine and longer on a loaded runner.
          for _ in $(seq 1 60); do
            STATE=$(curl -fsS "${URL}activity")
            echo "$STATE" | grep -q '"running": *false' && break
            sleep 5
          done
          echo "$STATE"
          echo "$STATE" | grep -q '"running": *false' || {
            echo "the audit never finished" >&2; cat "$OUT/server.log"; exit 1; }
          echo "$STATE" | grep -q '"state": *"done"' || {
            echo "the audit finished but did not succeed" >&2; exit 1; }

          # A batch whose Lighthouse is unavailable completes on the network
          # collectors alone, so assert the lab observations actually landed.
          echo "$STATE" | grep -qE '"observations": *[1-9][0-9]+' || {
            echo "too few observations: Lighthouse probably did not run" >&2; exit 1; }

          # The report preview must be the report, not the app shell.
          curl -fsS "${URL}run/1/report.html" | grep -qi 'site performance' || {
            echo "the report preview did not render the report" >&2; exit 1; }

          $CLEAN "$APP" --cli --db "$OUT/v.sqlite3" report 1 -o "$OUT"

          # A glob inside `test -f` is a syntax error on multiple matches
          # and silently passes the literal string on zero. Count instead.
          count=$(find "$OUT" -name '*.pdf' | wc -l)
          echo "PDFs produced: $count"
          [ "$count" -ge 1 ]

          # Size too, not just existence. A zero-byte file satisfies a
          # count and is not a PDF. (The shell waits for any child here
          # regardless of subsystem, so the fire-and-forget problem the
          # Windows step hit does not arise on this side.)
          find "$OUT" -name '*.pdf' -printf '  %f: %s bytes\n'
          [ -z "$(find "$OUT" -name '*.pdf' -size -1k)" ] || {
            echo "a PDF is under 1KB" >&2; exit 1; }

      - name: Verify the bundle (Windows)
        if: steps.gate.outputs.build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "$PWD\dist\SLAP\SLAP.exe"
          $server = $null
          $fixture = Start-Process python -ArgumentList "-m","tests.fixture_server","8899" -PassThru
          Start-Sleep -Seconds 3
          try {
            $out = "$env:RUNNER_TEMP\verify"
            New-Item -ItemType Directory -Force -Path $out | Out-Null

            # ------------------------------------------------------------
            # The Windows equivalent of the `env -i` used on the other
            # platforms. Without this the job-wide PLAYWRIGHT_BROWSERS_PATH
            # leaks in and the bundle happily uses the STAGING browser, so
            # the step reported success while proving nothing about whether
            # the bundle ships a working one. It printed the staging path
            # right there in the log and nobody had to notice.
            #
            # PATH is cut to the system directories so the runner's Node
            # and Python cannot stand in for the bundled ones either.
            # ------------------------------------------------------------
            Remove-Item Env:PLAYWRIGHT_BROWSERS_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD -ErrorAction SilentlyContinue
            Remove-Item Env:CHROME_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
            Remove-Item Env:NODE_PATH -ErrorAction SilentlyContinue
            $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"

            # doctor exits 1 with no CrUX key, so assert on its output.
            $doctor = & $app --cli doctor 2>&1 | Out-String
            Write-Host $doctor
            if ($doctor -notmatch '\[ok \] Lighthouse lab data') { throw "Lighthouse backend missing" }
            if ($doctor -notmatch '\[ok \] PDF export') { throw "PDF backend missing" }
            # A bundle with no vulnerability database reports zero known
            # vulnerabilities forever and looks clean doing it.
            if ($doctor -notmatch '\[ok \] Vulnerability database') { throw "vulnerability database missing" }

            $vulndb = & $app --cli vulndb status 2>&1 | Out-String
            Write-Host $vulndb
            if ($vulndb -notmatch 'npm: OSV.dev') { throw "the bundled database has no npm source" }

            # Every path doctor prints must live inside the bundle. Without
            # this the step passes on a bundle that quietly borrowed the
            # build machine's browser, which is the exact failure the
            # environment scrub above is meant to expose.
            if ($doctor -match 'packaging.staging') {
              throw "doctor resolved a path in packaging/staging: the bundle is not self-contained"
            }

            # ----------------------------------------------------------
            # Everything below drives the bundled WEB SERVER, which is what
            # a teammate gets when they double-click the app.
            #
            # Start-Process, not `&`: this one we deliberately do NOT wait
            # for. (The opposite mistake, calling a short-lived command
            # bare, is what made an earlier run report "no PDF produced"
            # while the app was still writing it. console=False means
            # PowerShell never blocks, so the choice has to be explicit
            # both ways.)
            # ----------------------------------------------------------
            $log = "$out\server.log"
            $server = Start-Process $app `
              -ArgumentList "--no-browser","--port","8898","--db","$out\v.sqlite3" `
              -PassThru -RedirectStandardOutput $log -RedirectStandardError "$out\server.err"

            # free_port() drifts to an OS-assigned port if 8898 is taken, so
            # read back the URL the server actually printed.
            $url = $null
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              if (Test-Path $log) {
                $m = Select-String -Path $log -Pattern 'http://127\.0\.0\.1:\d+/' | Select-Object -First 1
                if ($m) { $url = $m.Matches[0].Value; break }
              }
            }
            if (-not $url) {
              if (Test-Path $log) { Get-Content $log }
              if (Test-Path "$out\server.err") { Get-Content "$out\server.err" }
              throw "the bundled server never printed a URL"
            }
            Write-Host "bundled server at $url"

            foreach ($path in @("", "findings", "healthz")) {
              $r = Invoke-WebRequest -Uri "$url$path" -UseBasicParsing -TimeoutSec 20
              Write-Host "  GET /$path -> $($r.StatusCode)"
              if ($r.StatusCode -ne 200) { throw "GET /$path returned $($r.StatusCode)" }
            }

            # A real Lighthouse audit, started the way an operator starts one.
            Invoke-WebRequest -Uri "${url}audit" -Method Post -UseBasicParsing `
              -Body @{ urls = "http://127.0.0.1:8899/index.html"; lighthouse = "1" } | Out-Null

            # Poll: a Lighthouse run is 30-40s on a fast machine and longer
            # on a loaded runner, so a fixed sleep is either flaky or slow.
            $state = $null
            foreach ($i in 1..60) {
              $state = Invoke-RestMethod -Uri "${url}activity" -TimeoutSec 20
              if (-not $state.running) { break }
              Start-Sleep -Seconds 5
            }
            $state | ConvertTo-Json -Depth 4 | Write-Host
            if ($state.running) { Get-Content $log; throw "the audit never finished" }
            if ($state.sites[0].state -ne "done") { throw "the audit did not succeed" }
            # A batch with Lighthouse unavailable still completes on the
            # network collectors, so assert the lab observations landed.
            if ($state.sites[0].observations -lt 20) {
              throw "only $($state.sites[0].observations) observations: Lighthouse probably did not run"
            }

            # The preview must be the report, not the app shell around it.
            $preview = Invoke-WebRequest -Uri "${url}run/1/report.html" -UseBasicParsing
            if ($preview.Content -notmatch '(?i)site performance') {
              throw "the report preview did not render the report"
            }

            # `| Out-String` is LOAD-BEARING, not tidiness.
            #
            # SLAP.exe is built console=False, so it is a GUI-subsystem
            # binary and PowerShell does NOT block on it. Called bare, this
            # returned instantly, Get-ChildItem found nothing, and the step
            # failed with "no PDF produced" while the app was still running.
            # The log proved it: the report's own output appeared AFTER the
            # exception that said it had not produced anything.
            #
            # Piping forces PowerShell to read stdout to EOF, which happens
            # when the process exits. The doctor and audit calls above were
            # already piped and so were already correct, which is exactly
            # why this was the only one that broke.
            $report = & $app --cli --db "$out\v.sqlite3" report 1 -o $out 2>&1 | Out-String
            Write-Host $report

            $pdfs = @(Get-ChildItem $out -Filter *.pdf)
            Write-Host "PDFs produced: $($pdfs.Count)"
            if ($pdfs.Count -lt 1) { throw "no PDF produced" }
            foreach ($pdf in $pdfs) {
              # A zero-byte file counts for Get-ChildItem and is not a PDF.
              if ($pdf.Length -lt 1024) { throw "$($pdf.Name) is only $($pdf.Length) bytes" }
              Write-Host "  $($pdf.Name): $([math]::Round($pdf.Length / 1KB)) KB"
            }
          } finally {
            Stop-Process -Id $fixture.Id -ErrorAction SilentlyContinue
            if ($server) { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
          }

      - name: Upload
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SLAP-${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error
          # ~400MB each. Default is 90 days, which for a private repo is
          # real storage cost for builds nobody will download after a week.
          retention-days: 14
          compression-level: 0   # already a zip
