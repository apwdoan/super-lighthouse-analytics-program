name: Release desktop app

# Publishes SLAP's installers as a GitHub Release.
#
#   1. Set the version in desktop/src-tauri/tauri.conf.json and in
#      [workspace.package] of desktop/Cargo.toml. The two must agree.
#   2. Commit, then tag that commit with the same version and push the tag:
#        git tag v0.2.0 && git push origin v0.2.0
#
# The tag is checked against both versions before any build minutes are
# spent. desktop.yml then builds every platform and self-checks each build
# on the runner that made it, and the release is published only if all of
# them succeeded: it carries every platform's installers or nothing. A tag
# with a pre-release part (v0.3.0-1) is published as a pre-release.
#
# Run it by hand to publish a tag that already exists (one pushed before
# this workflow, or one whose release run failed), optionally as a draft
# to look over before publishing it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, like v0.2.0
        required: true
        type: string
      draft:
        description: Save the release as a draft, to publish by hand
        type: boolean
        default: false

permissions:
  contents: read

# One release run per tag at a time: a second one waits instead of racing.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the tag against the app version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      # Tauri names every installer after the version it builds, so a tag
      # that disagrees with the code would publish files named for another
      # release. Values arrive through env, never interpolated into the script.
      - name: Compare the tag with tauri.conf.json and Cargo.toml
        id: check
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The Windows MSI (WiX) takes a pre-release part only if it is a
          # number up to 65535, so anything else stops here, before the
          # other platforms have spent their minutes on it.
          if [ "$TAG" = "$version" ] || ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-([0-9]+))?$ ]] \
             || { [ -n "${BASH_REMATCH[2]:-}" ] && [ "$((10#${BASH_REMATCH[2]}))" -gt 65535 ]; }; then
            echo "::error::'$TAG' is not a release tag. Use v and the version: v0.2.0, or v0.3.0-1 for a pre-release."
            exit 1
          fi

          conf=$(jq -r '.version' desktop/src-tauri/tauri.conf.json)
          cargo=$(awk '/^\[workspace\.package\]/ { inside = 1; next }
                       /^\[/ { inside = 0 }
                       inside && /^version *=/ { gsub(/^[^"]*"|".*$/, ""); print; exit }' desktop/Cargo.toml)
          ok=true
          if [ "$conf" != "$version" ]; then
            echo "::error file=desktop/src-tauri/tauri.conf.json::The app version is $conf, but the tag is $TAG."
            ok=false
          fi
          if [ "$cargo" != "$version" ]; then
            echo "::error file=desktop/Cargo.toml::The workspace version is $cargo, but the tag is $TAG."
            ok=false
          fi
          if [ "$ok" != true ]; then
            echo "Set both to $version, commit, and tag that commit."
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG: version $version, pre-release $prerelease."

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read
    with:
      ref: refs/tags/${{ needs.version.outputs.tag }}
      platforms: all

  publish:
    name: Publish the release
    # Runs only when the version check and every platform's build passed.
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # to create the release and upload its files
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download the self-checked builds
        uses: actions/download-artifact@v8
        with:
          pattern: SLAP-desktop-*
          path: builds

      - name: Collect the installers and their checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          # One file per download. The macOS .app folders are left out:
          # each one travels inside its .dmg.
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            if [ -e "release/$name" ]; then
              echo "::error::Two builds produced $name."
              exit 1
            fi
            cp "$file" "release/$name"
          done < <(find builds -type f -not -path '*.app/*' \
                     \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \
                        -o -name '*.deb' -o -name '*.AppImage' \) -print0)

          # Every platform, or no release.
          missing=0
          for want in '*.msi:Windows MSI' '*-setup.exe:Windows installer' \
                      '*aarch64*.dmg:Apple Silicon disk image' '*x64*.dmg:Intel Mac disk image' \
                      '*.deb:Linux package' '*.AppImage:Linux AppImage'; do
            if ! compgen -G "release/${want%%:*}" > /dev/null; then
              echo "::error::The builds have no ${want#*:}."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

          (cd release && sha256sum -- * > SHA256SUMS.txt)
          ls -l release
          cat release/SHA256SUMS.txt

      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          # A table row for each file matching a pattern.
          row() {
            local file
            for file in release/$1; do
              # The backticks are Markdown's, for the file name, not a command.
              # shellcheck disable=SC2016
              if [ -e "$file" ]; then printf '| %s | `%s` |\n' "$2" "${file#release/}"; fi
            done
          }
          appimage=$(cd release && compgen -G '*.AppImage' | head -n 1)
          deb=$(cd release && compgen -G '*.deb' | head -n 1)
          {
            echo "## Downloads"
            echo
            echo "| For | File |"
            echo "|---|---|"
            row '*-setup.exe' 'Windows 10 or 11 (64-bit)'
            row '*.msi' 'Windows, for managed installs (MSI)'
            row '*aarch64*.dmg' 'Mac with Apple Silicon (M1 and later)'
            row '*x64*.dmg' 'Mac with an Intel processor'
            row '*.AppImage' 'Linux (64-bit), runs without installing'
            row '*.deb' 'Debian or Ubuntu (64-bit)'
            echo
            echo "Every build was started and self-checked on the machine that built it before it was published. \`SHA256SUMS.txt\` lists each file's SHA-256 checksum."
            echo
            echo "### The first launch"
            echo
            echo "These builds are not code-signed yet, so each system asks once before opening SLAP:"
            echo
            echo "- **Windows**: if SmartScreen says \"Windows protected your PC\", choose **More info**, then **Run anyway**."
            echo "- **Mac**: drag SLAP into Applications, then Control-click it and choose **Open**. If macOS says SLAP is damaged, run \`xattr -dr com.apple.quarantine /Applications/SLAP.app\` once in Terminal."
            echo "- **Linux**: run \`chmod +x $appimage\` before opening the AppImage, or install the package with \`sudo apt install ./$deb\`."
            echo
          } > notes.md
          cat notes.md

      # gh creates a new release as a draft, uploads every file, and only
      # then publishes it, so no one can download a half-uploaded release.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          DRAFT: ${{ inputs.draft == true }}
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2> /dev/null || echo none)
          case "$state" in
            none)
              flags=(--verify-tag --title "SLAP $VERSION" --notes-file notes.md --generate-notes)
              if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
              if [ "$DRAFT" = true ]; then flags+=(--draft); fi
              gh release create "$TAG" release/* "${flags[@]}"
              ;;
            true)
              # A draft from an earlier run: bring its files up to date.
              gh release upload "$TAG" release/* --clobber
              ;;
            *)
              # A published release keeps the files people may already have
              # downloaded and checked against its checksums.
              echo "::error::$TAG is already published, so its files are left as they are. Delete that release, or tag a new version, to publish these builds."
              exit 1
              ;;
          esac
          url=$(gh release view "$TAG" --json url --jq '.url')
          echo "Released $TAG: $url"
          echo "Released [SLAP $VERSION]($url)." >> "$GITHUB_STEP_SUMMARY"
