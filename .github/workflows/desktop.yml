name: Build desktop app (Tauri)

# THE build lane: the pipeline that builds SLAP. It began life
# dispatch-only, proving the four-target pipeline on a near-empty app
# before any logic landed, because packaging failures (codesign walking
# the runtime tree, PowerShell not waiting for GUI processes, retired
# runner images) all surface only when a real runner builds and runs a
# real artifact.
#
# Run it by hand to try a build; its artifacts stay on the run. Releases
# come from release.yml, which calls this workflow for a tag, so a release
# ships exactly what this lane builds and self-checks, and a tag builds
# once. dev-build.yml calls it too, and combines what every platform built
# into one download. Same trigger philosophy as the original build
# workflow: each platform produces a real artifact and real minutes, so not
# on every push.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        default: all
        options:
          - all
          - windows
          - macos          # both Macs
          - macos-arm64    # Apple Silicon only
          - macos-x64      # Intel only
          - linux
  workflow_call:
    inputs:
      ref:
        description: The tag, branch or commit to build. Empty builds the caller's own ref.
        type: string
        default: ""
      platforms:
        description: Which platforms to build, as for a manual run.
        type: string
        default: all
      retention-days:
        description: How long each platform's artifact is kept.
        type: number
        default: 14

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    strategy:
      # One platform failing should not cancel the others.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            wanted: windows
            family: windows
            bundles: msi,nsis

          # macos-latest is Apple Silicon.
          - os: macos-latest
            label: macos-arm64
            wanted: macos-arm64
            family: macos
            bundles: app,dmg

          # Intel. macos-15-intel: macos-13
          # was retired 2025-12-04, and 15 is the oldest supported image,
          # available until Actions drops x86_64 in August 2027.
          - os: macos-15-intel
            label: macos-x64
            wanted: macos-x64
            family: macos
            bundles: app,dmg

          - os: ubuntu-latest
            label: linux-x64
            wanted: linux
            family: linux
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v5
        with:
          # Empty on a manual run, which builds its own ref; release.yml
          # passes the tag it is releasing.
          ref: ${{ inputs.ref }}

      # The single gate decides whether to build, values through env
      # rather than interpolated into the script.
      - name: Decide whether to build this platform
        id: gate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PICKED: ${{ inputs.platforms || 'all' }}
          WANTED: ${{ matrix.wanted }}
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          # Only a manual run's platform picker narrows the build. A caller
          # (release.yml) passes "all"; its event can be a tag push or a
          # manual run of its own, so the event alone cannot decide.
          if [ "$EVENT" != "workflow_dispatch" ] \
             || [ "$PICKED" = "all" ] \
             || [ "$PICKED" = "$WANTED" ] \
             || [ "$PICKED" = "$FAMILY" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building $WANTED."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $WANTED (picked: $PICKED). The core tests still"
            echo "run, which is the point of not gating the whole job."
          fi

      - uses: dtolnay/rust-toolchain@stable

      # Cargo caching scoped to the desktop workspace. Without it every
      # dispatch recompiles ~450 crates from scratch on every runner.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Node is here only to run the Tauri CLI (a prebuilt binary from
      # npm). Nothing desktop-side executes on this Node at runtime.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The list from Tauri's own Linux prerequisites for webkit2gtk 4.1
      # on ubuntu-latest (24.04). AppImage packaging additionally wants
      # patchelf and librsvg.
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      # Runs on every platform in the matrix regardless of what is being
      # built: "does the core compile and pass on
      # Intel macOS" is worth knowing even on a run that only ships the
      # arm64 bundle.
      - name: Run the core tests
        working-directory: desktop
        run: cargo test -p slap-core

      - name: Install the Tauri CLI
        if: steps.gate.outputs.build == 'true'
        run: npm install -g @tauri-apps/cli@^2

      # The Lighthouse worker's node_modules are bundled into the app as a
      # resource, so they must exist before the build. Unlike the CLI Node
      # above, THIS is shipped and executed at runtime.
      - name: Prepare bundled Lighthouse (worker deps + Node runtime)
        if: steps.gate.outputs.build == 'true'
        working-directory: desktop
        run: node scripts/prepare-bundle.mjs

      # Bash on every runner, and the list quoted. Windows steps default to
      # PowerShell, where `tauri` is npm's tauri.ps1 shim: a PowerShell
      # script, so a bare msi,nsis reaches it as an array, and the shim
      # passes that on as one argument, "msi nsis", which the CLI refuses.
      - name: Build the bundles
        if: steps.gate.outputs.build == 'true'
        working-directory: desktop
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: tauri build --bundles "$BUNDLES"

      # ----------------------------------------------------------------
      # Run the artifact that was just built. The assertions live in
      # the binary (--self-check); this step only finds the executable
      # and reads the exit code.
      # ----------------------------------------------------------------
      - name: Self-check the built binary
        if: steps.gate.outputs.build == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          desktop/target/release/slap-desktop --self-check

      - name: Self-check the built binary (Windows)
        if: steps.gate.outputs.build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "desktop\target\release\slap-desktop.exe"
          if (-not (Test-Path $app)) { throw "no slap-desktop.exe at $app" }
          # Piped, never bare: slap-desktop.exe is a GUI-subsystem binary
          # in release, and PowerShell does not wait for those. The pipe
          # forces a read to EOF, which means waiting for the exit code.
          # This lesson was learned the expensive way on a release that
          # only worked in the environment that built it; it applies to
          # the Rust binary identically.
          & $app --self-check 2>&1 | ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) { throw "self-check failed (exit $LASTEXITCODE)" }

      # The app without an installer, to run from a folder. Never the bare
      # executable: Lighthouse needs the bundled Node and worker, which the
      # app looks for beside it, so each platform packs the binary with
      # them, as an installed copy has them, in an archive that keeps file
      # permissions (an artifact does not).
      #   Windows: slap-desktop.exe, slap-node.exe and _up_/worker, side by
      #            side, as the installer lays them out.
      #   macOS:   the .app, which holds all three already.
      #   Linux:   the .deb's own files: bin/, lib/ and share/. The app finds
      #            its resources in ../lib beside bin/, as it does in /usr.
      - name: Package the portable binary
        if: steps.gate.outputs.build == 'true'
        working-directory: desktop
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          out=target/release/portable
          rm -rf "$out"
          mkdir -p "$out/SLAP"
          case "$RUNNER_OS" in
            Windows)
              cp target/release/slap-desktop.exe target/release/slap-node.exe "$out/SLAP/"
              cp -R target/release/_up_ "$out/SLAP/"
              test -f "$out/SLAP/_up_/worker/worker.js"
              test -d "$out/SLAP/_up_/worker/node_modules/lighthouse"
              zip="SLAP_${version}_${LABEL}-portable.zip"
              if command -v 7z > /dev/null; then
                (cd "$out" && 7z a -tzip -bso0 -bsp0 "$zip" SLAP)
              else
                (cd "$out" && pwsh -NoProfile -Command "Compress-Archive -Path SLAP -DestinationPath '$zip'")
              fi
              ;;
            macOS)
              app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
              test -n "$app"
              test -x "$app/Contents/MacOS/slap-node"
              test -n "$(find "$app/Contents/Resources" -path '*/worker/worker.js' -print -quit)"
              ditto -c -k --sequesterRsrc --keepParent "$app" "$out/SLAP_${version}_${LABEL}.app.zip"
              ;;
            Linux)
              deb=$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n 1)
              test -n "$deb"
              dpkg-deb -x "$deb" "$out/deb"
              mv "$out/deb/usr/"* "$out/SLAP/"
              test -x "$out/SLAP/bin/slap-desktop"
              test -x "$out/SLAP/bin/slap-node"
              test -n "$(find "$out/SLAP/lib" -path '*/_up_/worker/worker.js' -print -quit)"
              tar -C "$out" -czf "$out/SLAP_${version}_${LABEL}-portable.tar.gz" SLAP
              ;;
          esac
          rm -rf "$out/SLAP" "$out/deb"
          ls -l "$out"

      # release.yml publishes these: it downloads every SLAP-desktop-*
      # artifact of the run and picks the installers out by extension, so
      # a renamed artifact or a new bundle type needs a matching change there.
      # dev-build.yml takes all of them, portable binaries included.
      - name: Upload
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: SLAP-desktop-${{ matrix.label }}
          path: |
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/portable/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 14 }}
