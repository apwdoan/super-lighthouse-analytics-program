# The audit engine: the collectors and the orchestration that runs them.
#
# Separate from slap-core on purpose. The core stays a light, HTTP-free
# layer (schema, storage, rules); the engine is where the real HTTP stack
# and the browser-driving collectors live, so that weight stays out of
# anything that only needs to read and render a stored audit.
[package]
name = "slap-engine"
version.workspace = true
edition.workspace = true

[dependencies]
slap-core = { path = "../slap-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
futures = "0.3"

# The client report render. minijinja is pure Rust (no C, no build step) and
# speaks Jinja, so it renders the shared report stylesheet and template
# unchanged.
minijinja = "2"

# rustls, not native-tls: one TLS story across Windows/macOS/Linux, no
# OpenSSL to find at build time. Auto-decompression is deliberately OFF (no
# gzip/brotli features): the collector reads Content-Encoding itself and
# decodes by hand, because knowing whether a response WAS compressed is an
# observation, and reqwest strips the header when it decodes for you.
# Decoding by hand is what makes "was it compressed" a fact we can record.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "io-util"] }

# The TLS collector runs its OWN handshake (not reqwest's) so it can read the
# certificate even when validation FAILS: an expired cert and a hostname
# mismatch are different findings, and both need the cert to explain them.
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
x509-parser = "0.16"

# The decoders the collector advertises in Accept-Encoding and applies by
# hand. It only ever asks for what it can decode here, so a response never
# comes back as bytes that merely look like a page.
flate2 = "1"
brotli = "7"
# For extracting the pinned Chrome for Testing download on first run.
zip = "2"

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
# test-util for the paused-clock token-bucket test.
tokio = { version = "1", features = ["test-util", "macros", "rt", "rt-multi-thread", "time"] }
