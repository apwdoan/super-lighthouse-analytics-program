# The core: everything that is not a window and not a browser.
#
# The rule this crate exists to enforce is ported from the Python side,
# where it is the single most protective decision the project made:
# nothing in the core imports a UI framework. `src/slap/` never imported
# Qt or FastAPI; `slap-core` never depends on tauri. A test reads this
# manifest and fails if that changes, the same way the Python AST test
# catches an ambitious import. Front ends are clients of the core.

[package]
name = "slap-core"
version.workspace = true
edition.workspace = true

[dependencies]
# bundled: compile SQLite in rather than binding whatever the OS carries.
# The Python app pins its SQLite the same way (via Python's own build), and
# the migration code depends on version-gated features like
# ALTER TABLE ... RENAME COLUMN (3.25+), so "some system sqlite" is a bug.
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
