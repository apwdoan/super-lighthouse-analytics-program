# SLAP findings rules.
#
# These are DATA. Tuning a threshold here must never require a code change.
# Evaluated by slap.findings.engine, which supports:
#   all / any / none          nesting
#   is eq ne gt gte lt lte    comparison
#   in not_in                 membership
#   contains not_contains     substring (case-insensitive)
#   matches                   regex
#   missing present           existence
#
# Placeholders like {http.ttfb} in title/detail/remediation are substituted
# from the page's observations. Unknown keys render as "n/a".
#
# Title and detail are read by the client, so they are written in plain
# language: say what is wrong and why it matters to a visitor, and put the
# technical name in brackets where someone fixing it needs it, as in "(HSTS)".
# Remediation is read by whoever makes the fix, so it may be technical.
#
# wp_rocket_setting is the remediation mapping that makes SLAP's reports
# prescriptive rather than diagnostic.

version: 1

rules:

  # ======================================================================
  # Field data: the verdict. Page one of the report.
  # ======================================================================

  - id: cwv-fail
    severity: critical
    title: "Real visitors are failing Google's Core Web Vitals"
    detail: >-
      Google's data from real visits over the last 28 days shows the main
      content appearing in {crux.lcp.p75}, a response to taps and clicks in
      {crux.inp.p75}, and a layout shift score of {crux.cls.p75}. At least
      one of these is outside Google's "good" range, so this is what real
      visitors on real connections experience, not just a lab test.
    when:
      all:
        - {metric: crux.cwv_pass, is: false}
    effort: varies
    evidence: [crux.lcp.p75, crux.inp.p75, crux.cls.p75, crux.lcp.good, crux.inp.good, crux.cls.good]

  - id: lcp-poor
    severity: high
    title: "The main content is slow to appear for real visitors ({crux.lcp.p75})"
    detail: >-
      For 1 in 4 visits, the main content takes {crux.lcp.p75} or longer to
      appear. Google rates anything over 4 seconds as poor; the target is
      2.5 seconds or less.
    when:
      all:
        - {metric: crux.lcp.p75, gt: 4000}
    impact_ms_from: crux.lcp.p75
    effort: medium
    remediation: >-
      Speed up the largest element at the top of the page first: preload the
      main (hero) image, serve it as WebP or AVIF at the size it is shown,
      and remove the CSS and fonts that hold it back.
    wp_rocket_setting: "File Optimization > Optimize CSS delivery; Media > Excluded images (exclude the LCP image from LazyLoad)"

  - id: inp-poor
    severity: high
    title: "The site is slow to respond to taps and clicks ({crux.inp.p75})"
    detail: >-
      For 1 in 4 interactions, the page takes {crux.inp.p75} or longer to
      visibly respond. Google rates anything over half a second as poor; the
      target is 0.2 seconds or less. This is almost always caused by the
      theme's or third parties' scripts keeping the browser busy.
    when:
      all:
        - {metric: crux.inp.p75, gt: 500}
    impact_ms_from: crux.inp.p75
    effort: high
    remediation: >-
      Review third-party scripts (chat widgets, tag managers, heatmaps) and
      delay or remove the ones that are not essential. Break up long-running
      tasks in the theme's JavaScript.
    wp_rocket_setting: "File Optimization > Delay JavaScript execution; Load JavaScript deferred"

  - id: cls-poor
    severity: high
    title: "Content jumps around while pages load (layout shift {crux.cls.p75})"
    detail: >-
      Real visitors see the page move while it loads (a layout shift score of
      {crux.cls.p75}; above 0.25 is poor, 0.1 or less is good). This is
      usually caused by images without set dimensions, ads, or web fonts
      that arrive late.
    when:
      all:
        - {metric: crux.cls.p75, gt: 0.25}
    effort: medium
    remediation: >-
      Set a width and height on every image and iframe, reserve space for ad
      and embed slots, and preload web fonts with font-display: swap.

  - id: no-field-data
    severity: info
    title: "Google has no real-visitor data for this site yet"
    detail: >-
      The site does not get enough traffic to appear in Google's Chrome User
      Experience Report, so every figure in this report comes from our own
      tests. Those tests are a reliable guide, but they cannot show exactly
      what your visitors experience.
    when:
      all:
        - {metric: crux.available, is: false}
    effort: none

  # ======================================================================
  # WP Rocket: the differentiator
  # ======================================================================

  - id: wprocket-cache-cold
    severity: high
    title: "WP Rocket is installed, but this page is not served from its cache"
    detail: >-
      WP Rocket {wprocket.version} is active, but this page was built from
      scratch when it was requested instead of being served from the cache,
      so the plugin's biggest speed benefit is being missed. Common causes:
      the page is excluded from caching, a login or cookie bypasses the
      cache, or the cache has not been built yet.
    when:
      all:
        - {metric: wprocket.present, is: true}
        - {metric: wprocket.page_cached, is: false}
    effort: low
    remediation: >-
      Check Advanced Rules > Never Cache URL(s) and Never Cache Cookies for
      an entry matching this page, then clear and preload the cache.
    wp_rocket_setting: "Preload > Activate Preloading; Advanced Rules > Never Cache URL(s)"

  - id: multiple-cache-layers
    severity: medium
    title: "More than one caching plugin is active"
    detail: >-
      Detected: {tech.cache_plugin}. Caching plugins that overlap often
      conflict, causing out-of-date pages, broken styling, and problems that
      are hard to track down.
    when:
      all:
        - {metric: tech.cache_plugin, contains: ","}
    effort: low
    remediation: >-
      Pick one caching plugin and fully remove the others, including leftover
      advanced-cache.php drop-ins and wp-config.php constants.

  # ======================================================================
  # Delivery and caching
  # ======================================================================

  - id: no-compression
    severity: high
    title: "Pages are sent without compression"
    detail: >-
      The page's HTML ({http.content_bytes}) was sent uncompressed. Gzip or
      Brotli compression typically makes it 70-80% smaller, and turning it on
      is a server setting, not a change to the site.
    when:
      all:
        - {metric: http.compressed, is: false}
        - {metric: http.content_bytes, gt: 4096}
    effort: low
    remediation: >-
      Turn on Brotli (preferred) or gzip at the web server or CDN for HTML,
      CSS, JavaScript and JSON.
    wp_rocket_setting: "WP Rocket enables gzip via .htaccess on Apache; on nginx enable it in the server config"

  - id: slow-ttfb
    severity: high
    title: "The server is slow to respond ({http.ttfb})"
    detail: >-
      The server took {http.ttfb} to start sending the page, and everything
      else waits for it. More than 0.8 seconds usually points to missing page
      caching, a slow database or overloaded hosting, rather than to the
      page's design.
    when:
      all:
        - {metric: http.ttfb, gt: 800}
    impact_ms_from: http.ttfb
    effort: medium
    remediation: >-
      Confirm page caching is actually serving this page, then look at the
      hosting plan, object caching (Redis or Memcached) and slow database
      queries, which on a CMS often come from plugins.
    wp_rocket_setting: "Preload > Activate Preloading; consider WP Rocket's Object Cache add-on"

  - id: short-cache-ttl
    severity: medium
    title: "Pages can only be cached for a very short time"
    detail: >-
      The caching rule is "{http.cache_control}", which keeps a copy for only
      {http.cache_max_age}. That is too short for browsers and content
      delivery networks to reuse the page, so most visits pay the full cost
      of building it.
    when:
      all:
        - {metric: http.cache_max_age, present: true}
        - {metric: http.cache_max_age, lt: 300}
    effort: low
    wp_rocket_setting: "Cache > Cache Lifespan"

  - id: no-cache-control
    severity: medium
    title: "Pages do not say how long they can be cached"
    detail: >-
      The page was sent without a caching rule (a Cache-Control header), so
      each browser and content delivery network guesses how long to keep it
      instead of following yours.
    when:
      all:
        - {metric: http.cache_control, missing: true}
        - {metric: http.status, eq: 200}
    effort: low
    wp_rocket_setting: "Cache > Cache Lifespan"

  - id: no-etag-or-validator
    severity: low
    title: "Returning visitors download pages in full every time"
    detail: >-
      Without an ETag or Last-Modified header, a returning visitor's browser
      cannot cheaply check whether the page has changed, so it downloads the
      whole page again.
    when:
      all:
        - {metric: http.has_etag, is: false}
        - {metric: http.status, eq: 200}
    effort: low

  - id: no-http2
    severity: low
    title: "The site uses an older connection protocol ({http.version})"
    detail: >-
      The server uses {http.version}. Newer versions (HTTP/2 and HTTP/3) load
      many files over one connection at once, which noticeably helps pages
      with lots of images and scripts. This is a hosting or CDN setting, not
      a change to the site.
    when:
      all:
        - {metric: http.version, in: ["HTTP/1.0", "HTTP/1.1"]}
    effort: low

  - id: redirect-chain
    severity: medium
    title: "Visitors pass through {redirect.hops} redirects before the page loads"
    detail: >-
      The route is {redirect.chain}. Each redirect adds a full round trip
      before the page can even start loading.
    when:
      all:
        - {metric: redirect.hops, gte: 2}
    effort: low
    remediation: >-
      Collapse the chain to a single redirect: point the old address straight
      at the final one, rather than chaining separate www and HTTPS
      redirects.

  - id: heavy-html
    severity: low
    title: "The page's HTML is large ({http.content_bytes})"
    detail: >-
      HTML this size usually means styles or scripts are written into the
      page itself, a page builder is producing bloated code, or the content
      should be split across several pages.
    when:
      all:
        - {metric: http.content_bytes, gt: 300000}
    effort: medium
    wp_rocket_setting: "File Optimization > Minify CSS/JavaScript files"

  # ======================================================================
  # Transport security
  # ======================================================================

  - id: https-unreachable
    severity: critical
    title: "The site could not be reached over a secure connection (HTTPS)"
    detail: >-
      A secure https:// connection failed ({https.error}), so this audit was
      carried out over plain http:// instead. Anyone who types the address or
      follows an https:// link sees a browser security error before the page
      loads, and every measurement in this report was taken over an
      unencrypted connection.
    when:
      all:
        - {metric: https.unreachable, is: true}
    effort: low
    remediation: >-
      Install a valid TLS certificate for the domain and its www address, and
      redirect http:// to https://. Most managed hosts offer this as a
      one-click "issue SSL certificate" option; if a certificate is already
      installed but connections still fail, the server's HTTPS setup is
      misconfigured.
    evidence: [https.error, tls.error, tls.valid]

  - id: tls-invalid
    severity: critical
    title: "The site's security certificate is not valid"
    detail: >-
      The certificate failed verification ({tls.error}). Visitors see a
      full-page browser warning before they ever reach the site.
    when:
      all:
        - {metric: tls.valid, is: false}
    effort: low
    remediation: >-
      Install a valid certificate that covers this domain (most hosts issue
      free ones), and make sure the server sends the full certificate chain.
    evidence: [tls.error, tls.issuer, tls.subject, tls.days_to_expiry]

  - id: tls-expiring
    severity: high
    title: "The security certificate expires in {tls.days_to_expiry}"
    detail: >-
      It was issued by {tls.issuer}. Renew it, or confirm that automatic
      renewal is working, now: an expired certificate blocks every visitor
      at once.
    when:
      all:
        - {metric: tls.valid, is: true}
        - {metric: tls.days_to_expiry, lt: 21}
    effort: low

  - id: tls-old-protocol
    severity: high
    title: "The site allows outdated encryption ({tls.protocol})"
    detail: >-
      TLS 1.0 and 1.1 are retired, fail the payment-card security standard
      (PCI DSS), and modern browsers warn about them or refuse them outright.
    when:
      all:
        - {metric: tls.protocol, in: ["TLSv1", "TLSv1.1", "SSLv3"]}
    effort: low
    remediation: "Disable TLS 1.0/1.1 at the server or CDN and require TLS 1.2 minimum."

  - id: no-https-upgrade
    severity: high
    title: "Visitors are not moved from http:// to the secure site"
    detail: >-
      A visit to http:// stayed on http://, so anyone who types the address
      without https://, or follows an old link, browses without encryption.
    when:
      all:
        - {metric: redirect.upgrades_to_https, is: false}
    effort: low
    remediation: "Add a server-level 301 from http:// to https:// for all paths."

  # ======================================================================
  # Security headers and cookies
  # ======================================================================

  - id: no-hsts
    severity: medium
    title: "Browsers are not told to always use a secure connection (HSTS)"
    detail: >-
      Without this header, a visitor's first request can be intercepted over
      an unencrypted connection before the site redirects them to https://,
      which is the opening an attacker on the same network needs.
    when:
      all:
        - {metric: sec.hsts, missing: true}
    effort: low
    remediation: "Send Strict-Transport-Security: max-age=31536000; includeSubDomains"

  - id: weak-hsts
    severity: low
    title: "The always-use-a-secure-connection rule (HSTS) expires too soon"
    detail: >-
      It lasts {sec.hsts_max_age}. Six months is the practical minimum; one
      year is standard, and is required to join browsers' built-in HTTPS
      list.
    when:
      all:
        - {metric: sec.hsts_max_age, present: true}
        - {metric: sec.hsts_max_age, lt: 15768000}
    effort: low

  - id: no-csp
    severity: medium
    title: "No policy limiting which scripts can run (Content-Security-Policy)"
    detail: >-
      A Content Security Policy is the main defence against malicious scripts
      being slipped into the site's pages, for example through a hacked
      plugin or third-party service.
    when:
      all:
        - {metric: sec.csp, missing: true}
    effort: high
    # Platform-neutral on purpose: the first real-site audit served this
    # sentence, then written as advice about WordPress plugins, to
    # wikipedia.org. Rule text speaks about every site it fires on.
    remediation: >-
      Start in report-only mode to gather violations before enforcing, since
      a strict policy on an established site will break existing embeds and
      inline scripts.

  - id: no-x-content-type-options
    severity: low
    title: "Browsers may guess file types (X-Content-Type-Options)"
    detail: >-
      Without this header, a browser may guess what kind of file it has been
      sent, and could run an uploaded file as a script. It is a one-line
      setting with no compatibility risk.
    when:
      all:
        - {metric: sec.x_content_type_options, missing: true}
    effort: low
    remediation: "Send X-Content-Type-Options: nosniff"

  - id: no-frame-protection
    severity: low
    title: "Other sites can show this site inside their pages (clickjacking)"
    detail: >-
      Neither X-Frame-Options nor a Content-Security-Policy frame-ancestors
      rule is set, so an attacker's page can display this site in a frame
      and trick visitors into clicking things they cannot see.
    when:
      all:
        - {metric: sec.x_frame_options, missing: true}
        - any:
            - {metric: sec.csp, missing: true}
            - {metric: sec.csp, not_contains: "frame-ancestors"}
    effort: low
    remediation: "Send X-Frame-Options: SAMEORIGIN, or a Content-Security-Policy with frame-ancestors 'self'."

  - id: no-referrer-policy
    severity: low
    title: "No rule for what other sites learn about each visit (Referrer-Policy)"
    detail: >-
      Without this header, how much of a page's address is passed to the
      other services the page loads is left to each browser. Current browsers
      pass only the domain, but older ones can pass the full address,
      including anything private in it.
    when:
      all:
        - {metric: sec.referrer_policy, missing: true}
    effort: low
    remediation: "Send Referrer-Policy: strict-origin-when-cross-origin"

  - id: cookies-insecure
    severity: high
    title: "{sec.cookies_insecure} cookie(s) can be sent without encryption"
    detail: >-
      Cookies without the Secure flag can travel over plain http://, exposing
      login sessions to anyone who can see the traffic, such as on public
      Wi-Fi.
    when:
      all:
        - {metric: sec.cookies_insecure, gt: 0}
    effort: low
    remediation: "Add the Secure attribute to every cookie the site sets."

  - id: cookies-no-httponly
    severity: medium
    title: "{sec.cookies_no_httponly} cookie(s) can be read by scripts"
    detail: >-
      Cookies without the HttpOnly flag can be read by any script on the
      page, including a compromised third-party script, which can turn an
      injected script into a stolen login session.
    when:
      all:
        - {metric: sec.cookies_no_httponly, gt: 0}
    effort: low
    remediation: "Add the HttpOnly attribute to every cookie that scripts do not need to read, starting with session cookies."

  - id: cookies-no-samesite
    severity: low
    title: "{sec.cookies_no_samesite} cookie(s) lack cross-site protection (SameSite)"
    detail: >-
      The SameSite setting is the main defence against another site making a
      visitor's browser act on this one without their knowledge. Some
      browsers assume a safe value when it is missing, but not all do, so
      stating it explicitly is safer.
    when:
      all:
        - {metric: sec.cookies_no_samesite, gt: 0}
    effort: low
    remediation: "Set SameSite=Lax (or Strict) on every cookie."

  - id: server-version-disclosure
    severity: low
    title: "The server reveals its software and version ({http.server})"
    detail: >-
      Advertising the exact version tells an attacker which published
      weaknesses to try first.
    when:
      all:
        - {metric: http.server, matches: "[0-9]+\\.[0-9]+"}
    effort: low
    remediation: "Suppress the version token (Apache: ServerTokens Prod; nginx: server_tokens off)."

  # ======================================================================
  # Lighthouse lab findings (Phase 2)
  #
  # Keyed off lh.opp.* metrics, which come from Lighthouse 13's INSIGHT
  # audits via their metricSavings API. The pre-13 audit IDs the industry
  # still quotes (render-blocking-resources, uses-long-cache-ttl,
  # modern-image-formats, offscreen-images) no longer exist; see the
  # LIGHTHOUSE_OPPORTUNITIES table in schema.rs.
  #
  # This is also where the roadmap's WP Rocket remediation mapping lives.
  # ======================================================================

  - id: lh-render-blocking
    severity: high
    title: "Some files hold back the page from appearing, by {lh.opp.render_blocking}"
    detail: >-
      Stylesheets and scripts at the top of the page must download and run
      before anything appears on screen. Lighthouse estimates the page could
      start appearing {lh.opp.render_blocking} sooner without them.
    when:
      all:
        - {metric: lh.opp.render_blocking, gt: 300}
    impact_ms_from: lh.opp.render_blocking
    effort: medium
    remediation: >-
      Inline the small amount of CSS needed for the first screen and load the
      rest asynchronously; defer every script that is not required to render.
    wp_rocket_setting: "File Optimization > Optimize CSS delivery; Load JavaScript deferred"

  - id: lh-image-delivery
    severity: high
    title: "Images could load {lh.opp.image_delivery} faster"
    detail: >-
      Images are larger, in older formats, or less compressed than they need
      to be. On a page with many photos this is usually the biggest and
      cheapest improvement available.
    when:
      all:
        - {metric: lh.opp.image_delivery, gt: 500}
    impact_ms_from: lh.opp.image_delivery
    effort: low
    remediation: >-
      Serve WebP or AVIF at the size the image is actually displayed, and
      lazy-load anything below the fold. Keep the main hero image loading
      straight away so the main content does not appear later.
    wp_rocket_setting: "Media > LazyLoad and Add missing image dimensions; pair with Imagify or ShortPixel for format conversion"

  - id: lh-document-latency
    severity: high
    title: "The page itself is slow to arrive"
    detail: >-
      Lighthouse estimates {lh.opp.document_latency} could be saved on the
      first request for the page alone: redirects, missing compression, or a
      server response that is not cached. Nothing else on the page can start
      until it arrives.
    when:
      all:
        - {metric: lh.opp.document_latency, gt: 300}
    impact_ms_from: lh.opp.document_latency
    effort: medium
    wp_rocket_setting: "Preload > Preload Cache; check Advanced Rules > Never Cache URL(s)"

  - id: lh-unused-css
    severity: medium
    title: "Unused styles (CSS) slow the page by {lh.opp.unused_css}"
    detail: >-
      Most of the stylesheet is never used on this page. Page builders and
      multipurpose themes often load the styles for every feature on every
      page.
    when:
      all:
        - {metric: lh.opp.unused_css, gt: 300}
    impact_ms_from: lh.opp.unused_css
    effort: medium
    wp_rocket_setting: "File Optimization > Optimize CSS delivery > Remove Unused CSS"

  - id: lh-unused-js
    severity: medium
    title: "Unused scripts (JavaScript) slow the page by {lh.opp.unused_js}"
    detail: >-
      The page downloads and processes scripts it never uses, usually because
      a plugin or the theme loads them on every page instead of only where
      they are needed.
    when:
      all:
        - {metric: lh.opp.unused_js, gt: 300}
    impact_ms_from: lh.opp.unused_js
    effort: medium
    wp_rocket_setting: "File Optimization > Delay JavaScript execution"

  - id: lh-unminified-assets
    severity: medium
    title: "Style and script files are bigger than they need to be"
    detail: >-
      Comments and spacing that only developers need are sent to every
      visitor. Removing them (minifying) is automatic and very unlikely to
      change how the site works.
    when:
      any:
        - {metric: lh.opp.unminified_css, gt: 150}
        - {metric: lh.opp.unminified_js, gt: 150}
    effort: low
    evidence: [lh.opp.unminified_css, lh.opp.unminified_js]
    wp_rocket_setting: "File Optimization > Minify CSS files and Minify JavaScript files"

  - id: lh-cache-lifetimes
    severity: medium
    title: "Images, styles and scripts are not cached for long"
    detail: >-
      Returning visitors download these files again because they are set to
      expire quickly, or not set at all. Lighthouse estimates
      {lh.opp.cache} could be saved.
    when:
      all:
        - {metric: lh.opp.cache, gt: 200}
    impact_ms_from: lh.opp.cache
    effort: low
    remediation: >-
      Set a long max-age (a year is standard) on fingerprinted static assets
      at the server or CDN.
    wp_rocket_setting: "WP Rocket writes browser caching rules to .htaccess on Apache; on nginx set expires headers in the server config"

  - id: lh-lcp-discovery
    severity: medium
    title: "The main image is found too late"
    detail: >-
      The browser cannot find the largest image at the top of the page until
      late in loading, which costs {lh.opp.lcp_discovery}. This usually
      happens when that image is lazy-loaded, or added by CSS or JavaScript.
    when:
      all:
        - {metric: lh.opp.lcp_discovery, gt: 200}
    impact_ms_from: lh.opp.lcp_discovery
    effort: low
    remediation: >-
      Put the hero image in the HTML with fetchpriority="high", and exclude
      it from lazy-loading.
    wp_rocket_setting: "Media > Excluded images or iframes (add the hero image)"

  - id: lh-third-parties
    severity: medium
    title: "Third-party scripts slow the page by {lh.opp.third_parties}"
    detail: >-
      Chat widgets, tag managers, analytics, heatmaps and ad scripts all run
      alongside the site's own code. Each one is someone else's code deciding
      how fast your page feels.
    when:
      all:
        - {metric: lh.opp.third_parties, gt: 400}
    impact_ms_from: lh.opp.third_parties
    effort: medium
    wp_rocket_setting: "File Optimization > Delay JavaScript execution (add the third-party domains)"

  - id: lh-legacy-javascript
    severity: low
    title: "Scripts include extra code for outdated browsers"
    detail: >-
      Code written for browsers almost nobody uses any more costs
      {lh.opp.legacy_javascript}. It comes from a theme, a plugin, or a build
      setting that targets very old browsers.
    when:
      all:
        - {metric: lh.opp.legacy_javascript, gt: 150}
    impact_ms_from: lh.opp.legacy_javascript
    effort: high

  - id: lh-font-display
    severity: low
    title: "Text is hidden while web fonts load"
    detail: >-
      Text stays invisible while a custom font downloads, which costs
      {lh.opp.font_display}. One setting (font-display) lets the browser show
      the text straight away in a fallback font.
    when:
      all:
        - {metric: lh.opp.font_display, gt: 100}
    impact_ms_from: lh.opp.font_display
    effort: low
    remediation: "Add font-display: swap to every @font-face rule, and preload the fonts used above the fold."
    wp_rocket_setting: "Preload > Fonts preloading"

  - id: lh-huge-page-weight
    severity: medium
    title: "The page is a very large download ({lh.total_bytes})"
    detail: >-
      This is the total of everything the page downloads. Anything past a
      couple of megabytes is slow on mobile data, and is usually mostly
      images or a large number of third-party scripts.
    when:
      all:
        - {metric: lh.total_bytes, gt: 3000000}
    effort: medium
    evidence: [lh.total_bytes, lh.opp.image_delivery, lh.opp.third_parties]

  - id: lh-heavy-main-thread
    severity: medium
    title: "The browser is kept busy for {lh.mainthread_work}"
    detail: >-
      While the browser is busy processing the page, it cannot respond to
      taps or clicks. Visitors experience this as the page feeling stuck.
    when:
      all:
        - {metric: lh.mainthread_work, gt: 4000}
    impact_ms_from: lh.mainthread_work
    effort: high
    wp_rocket_setting: "File Optimization > Delay JavaScript execution"

  # --- Non-performance categories ---------------------------------------

  - id: lh-accessibility-poor
    severity: medium
    title: "Accessibility score is {lh.score.accessibility} out of 100"
    detail: >-
      Automated checks found problems that affect people using screen
      readers, keyboard navigation, or high-contrast settings. Automated
      testing catches only some accessibility problems, so treat this as a
      starting point rather than a full assessment.
    when:
      all:
        - {metric: lh.score.accessibility, lt: 90}
    effort: medium
    evidence: [lh.score.accessibility]

  - id: lh-seo-poor
    severity: medium
    title: "Search engine (SEO) score is {lh.score.seo} out of 100"
    detail: >-
      These checks cover the basics search engines rely on: a page
      description, pages they are allowed to read, descriptive link text, and
      a mobile-friendly setup. They are not rankings, but failing them makes
      ranking harder.
    when:
      all:
        - {metric: lh.score.seo, lt: 90}
    effort: low
    evidence: [lh.score.seo]

  - id: lh-best-practices-poor
    severity: low
    title: "Best Practices score is {lh.score.best_practices} out of 100"
    detail: >-
      Covers errors in the browser, outdated browser features, insecure
      requests, and stretched or squashed images.
    when:
      all:
        - {metric: lh.score.best_practices, lt: 90}
    effort: low
    evidence: [lh.score.best_practices]

  # --- Measurement quality ----------------------------------------------
  # The roadmap's instruction: if the spread is wide, say so on the report
  # rather than hiding it. The report lists these three as notes on the
  # audit, not as problems with the site.

  - id: lh-unstable-measurement
    severity: info
    title: "Results varied noticeably between tests"
    detail: >-
      Across {lh.runs} tests, the performance score moved by
      {lh.score.performance.spread} points and the time for the main content
      to appear by {lh.lcp.spread}. This report uses the middle result, which
      is the fair figure, but treat small differences from an earlier audit
      with caution.
    when:
      any:
        - {metric: lh.score.performance.spread, gt: 10}
        - {metric: lh.lcp.spread, gt: 1500}
    effort: none
    evidence: [lh.runs, lh.score.performance.spread, lh.lcp.spread, lh.tbt.spread]

  - id: lh-contended-measurement
    severity: info
    title: "The testing computer was slow or busy during this audit"
    detail: >-
      Lighthouse's own speed check found the computer running these tests
      slow or busy. That makes pages look less responsive than they are, so
      the lab figures here are likely on the pessimistic side. Real-visitor
      data, where shown, is unaffected.
    when:
      any:
        - {metric: lh.benchmark_index, lt: 1000}
        - {metric: lh.benchmark_index.spread, gt: 500}
    effort: none
    evidence: [lh.benchmark_index, lh.benchmark_index.spread, lh.runs]

  # Run-level, written once on the home page when a run is finalised. The
  # per-page rule above catches a page measured on a slow or busy machine;
  # this catches the machine CHANGING speed between pages, which is what a
  # many-hour every-page batch does when it warms up, throttles, or goes onto
  # battery. Each page's own benchmark can look fine while pages measured
  # hours apart are no longer comparable.
  - id: lh-benchmark-drift
    severity: info
    title: "The testing computer's speed changed during this audit"
    detail: >-
      Lighthouse's own speed check on the testing computer varied by
      {lh.run.benchmark_drift} across the {lh.run.pages_measured} pages
      tested. Heat, power settings and other work change how fast a computer
      runs, so pages tested at different times are best compared by their
      problems rather than by small score differences.
    when:
      all:
        - {metric: lh.run.benchmark_drift, gt: 0.2}
    effort: none
    evidence: [lh.run.benchmark_min, lh.run.benchmark_max, lh.run.benchmark_drift, lh.run.pages_measured]

  # --- Per-page subresources -------------------------------------------
  #
  # These are the rules per-page analysis exists for. A site's home page is
  # usually the one page anyone has looked at since the TLS migration; the
  # old blog post still pulling a hero image over http:// is the one nobody
  # has opened in three years.
  #
  # Note the unit discipline: `mixed.insecure_count` is a COUNT, so the
  # title interpolates it bare. Appending "files" inside the title text
  # would be fine, but appending a unit the registry also renders gives you
  # "3 resourcesresources". A test scans this file for exactly that.

  - id: mixed-content
    severity: high
    title: "{mixed.insecure_count} file(s) load over an insecure connection"
    detail: >-
      This page is secure (https://) but loads {mixed.insecure_count} file(s)
      over plain http://. Browsers block insecure scripts and stylesheets
      outright, so they simply do not work, and insecure images may not load
      at all. The files are {mixed.insecure_urls}.
    when:
      all:
        - {metric: mixed.insecure_count, gt: 0}
    effort: low
    remediation: >-
      Change each URL to https://, or to a protocol-relative path if the
      host supports TLS. If the third-party host has no certificate, find a
      replacement: there is no way to load it securely.
    evidence: [mixed.insecure_count, mixed.insecure_urls, mixed.method]

  - id: many-third-party-origins
    severity: low
    title: "The page loads files from {thirdparty.origin_count} other websites"
    detail: >-
      Each extra website costs connection time before its first file
      arrives, and each one is code you do not control running on your page.
      They are {thirdparty.origins}.
    when:
      all:
        - {metric: thirdparty.origin_count, gt: 8}
    effort: medium
    remediation: >-
      Review what each one is for. Host fonts and small scripts yourself, and
      remove tags for tools nobody uses any more.
    wp_rocket_setting: >-
      Under File Optimization, self-hosting Google Fonts removes one origin
      outright. WP Rocket's "Delay JavaScript execution" also defers
      third-party scripts until interaction.
    evidence: [thirdparty.origin_count, thirdparty.origins]

  - id: form-posts-over-http
    severity: critical
    title: "A form on this page sends what visitors type without encryption"
    detail: >-
      The page is secure, but a form sends its contents to an http://
      address, so everything typed into it, including passwords and card
      details, travels across the internet unencrypted. Browsers show a
      full-page warning when it is submitted.
    when:
      all:
        - {metric: mixed.insecure_forms, gt: 0}
    effort: low
    remediation: Point the form action at https://.
    evidence: [mixed.insecure_forms, mixed.insecure_form_urls]

  # --- Known vulnerabilities ---------------------------------------------
  #
  # Two families, and the split between them is the whole design.
  #
  # `vuln-confirmed-*` fires on versions a BROWSER OBSERVED: Lighthouse read
  # the version out of the running library, or the software announced itself
  # in a generator tag. Those may name a CVE at its real severity.
  #
  # `vuln-possible` fires on versions INFERRED from a ?ver= query string.
  # That value is frequently the WordPress core version rather than the
  # plugin's, a cache-buster, or a hash, and optimisers rewrite it. It is
  # capped at medium, it says how the version was determined, and it asks the
  # client to confirm rather than telling them they are exposed.
  #
  # A confidently wrong CVE in a client report is the worst thing this tool
  # can print, so the asymmetry is deliberate: over-reporting a real problem
  # as "possible" costs a follow-up email, under-reporting a guess as
  # "critical" costs the relationship.

  - id: vuln-confirmed-critical
    severity: critical
    title: "{vuln.confirmed_critical} critical security flaw(s) in software running on this page: {vuln.confirmed_ids}"
    detail: >-
      A browser read these version numbers from the running page, so they are
      not guesses. Affected: {vuln.confirmed_detail}.
    when:
      all:
        - {metric: vuln.confirmed_critical, gt: 0}
    effort: medium
    remediation: >-
      Update the named components. If an update is not possible immediately,
      check whether the vulnerable code path is reachable on your site.
    evidence: [vuln.confirmed_critical, vuln.confirmed_detail, vuln.db_generated]

  - id: vuln-confirmed-high
    severity: high
    title: "{vuln.confirmed_high} serious security flaw(s) in software running on this page: {vuln.confirmed_ids}"
    detail: >-
      A browser read these version numbers from the running page, so they are
      not guesses. Affected: {vuln.confirmed_detail}.
    when:
      all:
        - {metric: vuln.confirmed_high, gt: 0}
        - {metric: vuln.confirmed_critical, lt: 1}
    effort: medium
    remediation: Update the named components to a version past the fix.
    evidence: [vuln.confirmed_high, vuln.confirmed_detail, vuln.db_generated]

  - id: vuln-confirmed-medium
    severity: medium
    title: "{vuln.confirmed_medium} known security flaw(s) in software running on this page: {vuln.confirmed_ids}"
    detail: >-
      These are less severe, but the version numbers were read from the
      running page rather than guessed. Affected: {vuln.confirmed_detail}.
    when:
      all:
        - {metric: vuln.confirmed_medium, gt: 0}
        - {metric: vuln.confirmed_high, lt: 1}
        - {metric: vuln.confirmed_critical, lt: 1}
    effort: low
    evidence: [vuln.confirmed_medium, vuln.confirmed_detail]

  - id: vuln-possible
    severity: medium
    title: "{vuln.possible_count} component(s) may be running a version with known flaws: {vuln.possible_ids}"
    detail: >-
      These versions were worked out from version numbers in file addresses,
      which is the only clue a site gives and is not always the real version:
      WordPress shows its own version for files that do not set one, caching
      plugins rewrite it, and some themes replace it with a code. Confirm the
      installed versions before acting. Possible matches:
      {vuln.possible_detail}.
    when:
      all:
        - {metric: vuln.possible_count, gt: 0}
    effort: low
    remediation: >-
      Check the actual installed versions in your admin panel, then update
      anything that matches. Do not treat this as confirmed.
    wp_rocket_setting: >-
      Not a WP Rocket setting. Note that WP Rocket's file optimisation
      rewrites ?ver= strings, which is why this check is inferential on a
      site that uses it.
    evidence: [vuln.possible_count, vuln.possible_detail]

  - id: vuln-not-checked
    severity: info
    title: "Some software could not be checked for known security flaws"
    detail: >-
      {vuln.unchecked_count} detected component(s) are not covered by this
      audit's vulnerability database ({vuln.unchecked_detail}). That is not a
      clean result for them; it means they were not checked. The database
      covers the components the US National Vulnerability Database can
      reliably identify.
    when:
      all:
        - {metric: vuln.unchecked_count, gt: 0}
    effort: none
    evidence: [vuln.unchecked_count, vuln.unchecked_detail]

  # --- Exposed endpoints --------------------------------------------------
  #
  # Only ever populated when probing was explicitly authorised for the host.

  - id: exposed-secrets
    severity: critical
    title: "{exposure.secrets_count} file(s) containing passwords or keys can be downloaded by anyone"
    detail: >-
      These addresses returned what looks like a configuration file or a
      database backup: {exposure.secrets_paths}. Anyone on the internet can
      download them. This is not a theoretical risk: the files were confirmed
      by their contents, not merely by the server's response.
    when:
      all:
        - {metric: exposure.secrets_count, gt: 0}
    effort: low
    remediation: >-
      Remove the files from the web root immediately, then rotate every
      credential in them: assume they are already compromised. Configure the
      server to refuse dotfiles and .sql, .bak and .save extensions.
    evidence: [exposure.secrets_count, exposure.secrets_paths]

  - id: exposed-vcs
    severity: critical
    title: "The site's source code history can be downloaded by anyone"
    detail: >-
      {exposure.vcs_paths} can be reached. A .git or .svn folder lets anyone
      rebuild the site's entire source code, including any password that was
      ever saved in it, even one removed later, because the history keeps it.
    when:
      all:
        - {metric: exposure.vcs_count, gt: 0}
    effort: low
    remediation: >-
      Block the directory at the web server, and stop deploying by pulling a
      repository into the web root. Rotate anything ever committed as a
      secret.
    evidence: [exposure.vcs_count, exposure.vcs_paths]

  - id: exposed-diagnostics
    severity: medium
    title: "Technical diagnostic pages can be viewed by anyone"
    detail: >-
      {exposure.info_paths} can be reached. Server status pages, phpinfo()
      output and debug logs reveal file paths, software versions and
      sometimes visitors' requests, which hands an attacker their research
      for free.
    when:
      all:
        - {metric: exposure.info_count, gt: 0}
    effort: low
    remediation: Restrict these paths to localhost, or remove them.
    evidence: [exposure.info_count, exposure.info_paths]

  - id: exposed-wp-surface
    severity: low
    title: "WordPress exposes more than it needs to"
    detail: >-
      {exposure.wp_surface_paths} can be reached. xmlrpc.php lets attackers
      try many passwords at once and misuse the site to attack others; the
      REST users list reveals valid usernames, which halves the work of
      guessing a login.
    when:
      all:
        - {metric: exposure.wp_surface_count, gt: 0}
    effort: low
    remediation: >-
      Disable XML-RPC if nothing uses it, and restrict the REST users
      endpoint to authenticated requests.
    evidence: [exposure.wp_surface_count, exposure.wp_surface_paths]

  - id: probe-inconclusive
    severity: info
    title: "The site returns a normal page for addresses that do not exist"
    detail: >-
      A request for a made-up address returned a normal page instead of a
      "not found" error, so the check for exposed files cannot tell a real
      file from a catch-all page. Anything it found was confirmed
      by its contents, which is reliable, but finding nothing is weaker
      evidence here than usual.
    when:
      all:
        - {metric: exposure.soft_404, is: true}
    effort: none
    evidence: [exposure.control_status, exposure.checked]

  - id: probe-blocked-by-firewall
    severity: info
    title: "A firewall stopped the check for exposed files"
    detail: >-
      A web application firewall answered instead of the site's server, so
      the check was stopped rather than continued: every address would have
      returned the same block page, and reporting those as problems would be
      wrong. The server itself may still expose these files to anything that
      reaches it directly.
    when:
      all:
        - {metric: exposure.waf_detected, is: true}
    effort: none
    evidence: [exposure.waf_detected]

  # --- Field-data history -------------------------------------------------
  #
  # Both rules fire on a THRESHOLD CROSSING, not on a raw delta. A site whose
  # LCP went 1.2s -> 2.4s doubled and still passes; one that went 2.4s -> 2.6s
  # barely moved and now fails. Only the second is worth a client's attention,
  # and only a threshold comparison tells them apart.

  - id: crux-history-regression
    severity: high
    title: "Real visitors' experience has got worse since {crux.history.first_period}"
    detail: >-
      {crux.history.regressed_metrics} was within Google's "good" range at the
      start of the {crux.history.weeks}-week period and is outside it now.
      This is measured on your actual visitors, not in a lab, so it reflects
      what people experienced. Each data point averages 28 days, so the
      change began earlier than it appears to.
    when:
      all:
        - {metric: crux.history.regressed, is: true}
    effort: varies
    remediation: >-
      Compare what shipped during this window. The lab findings in this report
      are the most likely causes; fix those first and the field data will
      follow within about four weeks.
    evidence: [crux.history.regressed_metrics, crux.history.weeks,
               crux.history.lcp.first, crux.history.lcp.delta]

  - id: crux-history-improvement
    severity: info
    title: "Real visitors' experience has improved since {crux.history.first_period}"
    detail: >-
      {crux.history.improved_metrics} was outside Google's "good" range at the
      start of the {crux.history.weeks}-week period and is within it now.
      This is measured on your actual visitors rather than in a lab, so it is
      evidence the work paid off, not a projection.
    when:
      all:
        - {metric: crux.history.improved, is: true}
    effort: none
    evidence: [crux.history.improved_metrics, crux.history.weeks,
               crux.history.lcp.first, crux.history.lcp.delta]
