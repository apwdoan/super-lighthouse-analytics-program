# SLAP findings rules.
#
# These are DATA. Tuning a threshold here must never require a code change.
# Evaluated by slap.findings.engine, which supports:
#   all / any / none          nesting
#   is eq ne gt gte lt lte    comparison
#   in not_in                 membership
#   contains not_contains     substring (case-insensitive)
#   matches                   regex
#   missing present           existence
#
# Placeholders like {http.ttfb} in title/detail/remediation are substituted
# from the page's observations. Unknown keys render as "n/a".
#
# wp_rocket_setting is the remediation mapping that makes SLAP's reports
# prescriptive rather than diagnostic.

version: 1

rules:

  # ======================================================================
  # Field data: the verdict. Page one of the report.
  # ======================================================================

  - id: cwv-fail
    severity: critical
    title: "Real users are failing Core Web Vitals"
    detail: >-
      Google's 28-day field data for this origin shows LCP {crux.lcp.p75},
      INP {crux.inp.p75}, CLS {crux.cls.p75}. At least one is outside the
      "good" threshold, which means real visitors on real connections are
      experiencing this as slow, not just a lab test.
    when:
      all:
        - {metric: crux.cwv_pass, is: false}
    effort: varies
    evidence: [crux.lcp.p75, crux.inp.p75, crux.cls.p75, crux.lcp.good, crux.inp.good, crux.cls.good]

  - id: lcp-poor
    severity: high
    title: "Largest Contentful Paint is poor for real users ({crux.lcp.p75})"
    detail: >-
      75% of visits render the main content in {crux.lcp.p75} or worse.
      Google rates anything above 4000ms as poor; 2500ms is the target.
    when:
      all:
        - {metric: crux.lcp.p75, gt: 4000}
    impact_ms_from: crux.lcp.p75
    effort: medium
    remediation: >-
      Attack the largest above-the-fold element first: preload the hero
      image, serve it as WebP/AVIF at the displayed size, and remove
      render-blocking CSS and fonts ahead of it.
    wp_rocket_setting: "File Optimization > Optimize CSS delivery; Media > Excluded images (exclude the LCP image from LazyLoad)"

  - id: inp-poor
    severity: high
    title: "Interaction responsiveness is poor ({crux.inp.p75})"
    detail: >-
      75% of interactions take {crux.inp.p75} or longer to produce a
      visual response. Above 500ms is rated poor; 200ms is the target.
      This is almost always third-party or theme JavaScript on the main thread.
    when:
      all:
        - {metric: crux.inp.p75, gt: 500}
    impact_ms_from: crux.inp.p75
    effort: high
    remediation: >-
      Audit third-party scripts (chat widgets, tag managers, heatmaps) and
      defer or remove what is not essential. Break up long tasks in theme JS.
    wp_rocket_setting: "File Optimization > Delay JavaScript execution; Load JavaScript deferred"

  - id: cls-poor
    severity: high
    title: "Layout shifts badly during load (CLS {crux.cls.p75})"
    detail: >-
      Real users see content jump around while the page loads
      (CLS {crux.cls.p75}; above 0.25 is rated poor, 0.1 is the target).
      Usually images without width/height, ads, or late-loading webfonts.
    when:
      all:
        - {metric: crux.cls.p75, gt: 0.25}
    effort: medium
    remediation: >-
      Set explicit width and height on all images and iframes, reserve space
      for ad and embed slots, and preload webfonts with font-display: swap.

  - id: no-field-data
    severity: info
    title: "No real-user field data available for this origin"
    detail: >-
      This origin does not have enough traffic to appear in the Chrome UX
      Report, so every number in this report is a lab measurement. Lab data
      is still diagnostic, but it cannot tell you what your actual visitors
      experience.
    when:
      all:
        - {metric: crux.available, is: false}
    effort: none

  # ======================================================================
  # WP Rocket: the differentiator
  # ======================================================================

  - id: wprocket-cache-cold
    severity: high
    title: "WP Rocket is installed but this page was not served from its cache"
    detail: >-
      WP Rocket {wprocket.version} is active on this site, but this URL was
      generated by PHP on request rather than served from the page cache.
      You are paying for the plugin and not getting its single largest win.
      Common causes: the page is excluded from caching, a logged-in or
      cookie-based session bypasses the cache, or the cache was never warmed.
    when:
      all:
        - {metric: wprocket.present, is: true}
        - {metric: wprocket.page_cached, is: false}
    effort: low
    remediation: >-
      Check Advanced Rules > Never Cache URL(s) and Never Cache Cookies for
      an entry matching this URL, then clear and preload the cache.
    wp_rocket_setting: "Preload > Activate Preloading; Advanced Rules > Never Cache URL(s)"

  - id: multiple-cache-layers
    severity: medium
    title: "More than one caching layer detected"
    detail: >-
      Detected: {tech.cache_plugin}. Stacked caching plugins routinely fight
      each other, producing stale assets, broken minification, and cache
      states that are impossible to reason about.
    when:
      all:
        - {metric: tech.cache_plugin, contains: ","}
    effort: low
    remediation: >-
      Pick one caching plugin and fully uninstall the others, including
      leftover advanced-cache.php drop-ins and wp-config.php constants.

  # ======================================================================
  # Delivery and caching
  # ======================================================================

  - id: no-compression
    severity: high
    title: "HTML is served uncompressed"
    detail: >-
      The document came back with no Content-Encoding, at
      {http.content_bytes}. Gzip or Brotli typically cuts HTML by
      70-80%, and this is a server configuration change, not a code change.
    when:
      all:
        - {metric: http.compressed, is: false}
        - {metric: http.content_bytes, gt: 4096}
    effort: low
    remediation: >-
      Enable Brotli (preferred) or gzip at the web server or CDN edge for
      text/html, text/css, application/javascript, and application/json.
    wp_rocket_setting: "WP Rocket enables gzip via .htaccess on Apache; on nginx enable it in the server config"

  - id: slow-ttfb
    severity: high
    title: "Server response is slow ({http.ttfb} to first byte)"
    detail: >-
      The server took {http.ttfb} to begin responding. Everything else on
      the page waits behind this. Above 800ms points at uncached PHP,
      a slow database, or an overloaded shared host, not at front-end assets.
    when:
      all:
        - {metric: http.ttfb, gt: 800}
    impact_ms_from: http.ttfb
    effort: medium
    remediation: >-
      Confirm page caching is actually serving this URL, then look at
      hosting tier, object caching (Redis/Memcached), and slow database
      queries, often from plugins on a CMS.
    wp_rocket_setting: "Preload > Activate Preloading; consider WP Rocket's Object Cache add-on"

  - id: short-cache-ttl
    severity: medium
    title: "The HTML response sets a very short cache lifetime"
    detail: >-
      Cache-Control is "{http.cache_control}", a max-age of
      {http.cache_max_age}. Lifetimes this short prevent CDN edge
      caching and browser reuse, so every visit pays full server cost.
    when:
      all:
        - {metric: http.cache_max_age, present: true}
        - {metric: http.cache_max_age, lt: 300}
    effort: low
    wp_rocket_setting: "Cache > Cache Lifespan"

  - id: no-cache-control
    severity: medium
    title: "No Cache-Control header on the HTML response"
    detail: >-
      The document came back with no Cache-Control header at all, which
      leaves caching behaviour up to each browser's and each CDN's
      heuristics rather than to you.
    when:
      all:
        - {metric: http.cache_control, missing: true}
        - {metric: http.status, eq: 200}
    effort: low
    wp_rocket_setting: "Cache > Cache Lifespan"

  - id: no-etag-or-validator
    severity: low
    title: "No ETag on the HTML response"
    detail: >-
      Without an ETag or Last-Modified validator, repeat visitors cannot
      revalidate cheaply and always re-download the full document.
    when:
      all:
        - {metric: http.has_etag, is: false}
        - {metric: http.status, eq: 200}
    effort: low

  - id: no-http2
    severity: low
    title: "Site is still served over HTTP/1.1"
    detail: >-
      The server negotiated {http.version}. HTTP/2 and HTTP/3 multiplex
      requests over one connection, which materially helps asset-heavy pages.
      This is a hosting or CDN toggle, not a site change.
    when:
      all:
        - {metric: http.version, in: ["HTTP/1.0", "HTTP/1.1"]}
    effort: low

  - id: redirect-chain
    severity: medium
    title: "Requests pass through {redirect.hops} redirects before landing"
    detail: >-
      Chain: {redirect.chain}. Every hop is a full round trip added before
      the page can even start loading.
    when:
      all:
        - {metric: redirect.hops, gte: 2}
    effort: low
    remediation: >-
      Collapse the chain to a single redirect: point the canonical host and
      protocol straight at the final URL rather than chaining www and HTTPS
      rules separately.

  - id: heavy-html
    severity: low
    title: "The HTML document itself is large ({http.content_bytes})"
    detail: >-
      A document this size usually signals inlined CSS/JS, a page builder
      emitting heavy markup, or content that should be paginated.
    when:
      all:
        - {metric: http.content_bytes, gt: 300000}
    effort: medium
    wp_rocket_setting: "File Optimization > Minify CSS/JavaScript files"

  # ======================================================================
  # Transport security
  # ======================================================================

  - id: https-unreachable
    severity: critical
    title: "The site could not be reached over HTTPS"
    detail: >-
      A request to the https:// URL failed at the connection or TLS layer
      ({https.error}), so this audit was carried out over plain http:// instead.
      Anyone who types the domain or follows an https:// link hits a browser
      security error before the page loads, and every measurement in this report
      was taken over an unencrypted connection.
    when:
      all:
        - {metric: https.unreachable, is: true}
    effort: low
    remediation: >-
      Provision a valid TLS certificate for the domain and its www host, and
      redirect http:// to https://. On most managed hosts this is a one-click
      "issue SSL certificate" action; if a certificate is already installed but
      the handshake still fails, the TLS terminator or virtual host is
      misconfigured.
    evidence: [https.error, tls.error, tls.valid]

  - id: tls-invalid
    severity: critical
    title: "The TLS certificate does not validate"
    detail: >-
      The certificate chain failed verification: {tls.error}. Visitors get a
      full-page browser interstitial before they ever see the site.
    when:
      all:
        - {metric: tls.valid, is: false}
    effort: low
    evidence: [tls.error, tls.issuer, tls.subject, tls.days_to_expiry]

  - id: tls-expiring
    severity: high
    title: "TLS certificate expires in {tls.days_to_expiry}"
    detail: >-
      Issued by {tls.issuer}. Renew or confirm auto-renewal now; an expired
      certificate takes the whole site offline for every visitor at once.
    when:
      all:
        - {metric: tls.valid, is: true}
        - {metric: tls.days_to_expiry, lt: 21}
    effort: low

  - id: tls-old-protocol
    severity: high
    title: "Site negotiates an obsolete TLS version ({tls.protocol})"
    detail: >-
      TLS 1.0 and 1.1 are deprecated and fail PCI DSS. Modern browsers warn
      or refuse outright.
    when:
      all:
        - {metric: tls.protocol, in: ["TLSv1", "TLSv1.1", "SSLv3"]}
    effort: low
    remediation: "Disable TLS 1.0/1.1 at the server or CDN and require TLS 1.2 minimum."

  - id: no-https-upgrade
    severity: high
    title: "Plain HTTP requests are not redirected to HTTPS"
    detail: >-
      A request over http:// stayed on http://. Any visitor typing the bare
      domain, or following an old link, browses unencrypted.
    when:
      all:
        - {metric: redirect.upgrades_to_https, is: false}
    effort: low
    remediation: "Add a server-level 301 from http:// to https:// for all paths."

  # ======================================================================
  # Security headers and cookies
  # ======================================================================

  - id: no-hsts
    severity: medium
    title: "No HTTP Strict Transport Security header"
    detail: >-
      Without HSTS, the first request of every session can be downgraded to
      plain HTTP before the redirect fires, which is the window an
      on-path attacker needs.
    when:
      all:
        - {metric: sec.hsts, missing: true}
    effort: low
    remediation: "Send Strict-Transport-Security: max-age=31536000; includeSubDomains"

  - id: weak-hsts
    severity: low
    title: "HSTS max-age is short"
    detail: >-
      max-age is {sec.hsts_max_age}. Six months (15768000) is the practical
      minimum; one year is standard and is required for preload-list eligibility.
    when:
      all:
        - {metric: sec.hsts_max_age, present: true}
        - {metric: sec.hsts_max_age, lt: 15768000}
    effort: low

  - id: no-csp
    severity: medium
    title: "No Content-Security-Policy header"
    detail: >-
      CSP is the main defence against cross-site scripting and against
      injected third-party scripts on a compromised site.
    when:
      all:
        - {metric: sec.csp, missing: true}
    effort: high
    # Platform-neutral on purpose: the first real-site audit served this
    # sentence, then written as advice about WordPress plugins, to
    # wikipedia.org. Rule text speaks about every site it fires on.
    remediation: >-
      Start in report-only mode to gather violations before enforcing, since
      a strict policy on an established site will break existing embeds and
      inline scripts.

  - id: no-x-content-type-options
    severity: low
    title: "Missing X-Content-Type-Options: nosniff"
    detail: >-
      Without nosniff, browsers may MIME-sniff a response and execute an
      upload as script. This is a one-line header with no compatibility risk.
    when:
      all:
        - {metric: sec.x_content_type_options, missing: true}
    effort: low

  - id: no-frame-protection
    severity: low
    title: "No clickjacking protection"
    detail: >-
      Neither X-Frame-Options nor a CSP frame-ancestors directive is set,
      so the site can be framed by an attacker's page.
    when:
      all:
        - {metric: sec.x_frame_options, missing: true}
        - any:
            - {metric: sec.csp, missing: true}
            - {metric: sec.csp, not_contains: "frame-ancestors"}
    effort: low

  - id: no-referrer-policy
    severity: low
    title: "No Referrer-Policy header"
    detail: >-
      Full URLs, including any tokens in query strings, leak to third-party
      resources by default.
    when:
      all:
        - {metric: sec.referrer_policy, missing: true}
    effort: low
    remediation: "Send Referrer-Policy: strict-origin-when-cross-origin"

  - id: cookies-insecure
    severity: high
    title: "{sec.cookies_insecure} cookie(s) set without the Secure flag"
    detail: >-
      Cookies without Secure are transmitted over plain HTTP, which exposes
      session identifiers to anyone on the network path.
    when:
      all:
        - {metric: sec.cookies_insecure, gt: 0}
    effort: low

  - id: cookies-no-httponly
    severity: medium
    title: "{sec.cookies_no_httponly} cookie(s) readable by JavaScript"
    detail: >-
      Cookies without HttpOnly can be read by any script on the page,
      including a compromised third-party script, which turns an XSS into
      full session theft.
    when:
      all:
        - {metric: sec.cookies_no_httponly, gt: 0}
    effort: low

  - id: cookies-no-samesite
    severity: low
    title: "{sec.cookies_no_samesite} cookie(s) without SameSite"
    detail: >-
      SameSite is the primary defence against cross-site request forgery.
      Browsers now default to Lax, but stating it explicitly is safer.
    when:
      all:
        - {metric: sec.cookies_no_samesite, gt: 0}
    effort: low

  - id: server-version-disclosure
    severity: low
    title: "Server header discloses software and version ({http.server})"
    detail: >-
      Advertising an exact version tells an attacker precisely which
      published CVEs to try first.
    when:
      all:
        - {metric: http.server, matches: "[0-9]+\\.[0-9]+"}
    effort: low
    remediation: "Suppress the version token (Apache: ServerTokens Prod; nginx: server_tokens off)."

  # ======================================================================
  # Lighthouse lab findings (Phase 2)
  #
  # Keyed off lh.opp.* metrics, which come from Lighthouse 13's INSIGHT
  # audits via their metricSavings API. The pre-13 audit IDs the industry
  # still quotes (render-blocking-resources, uses-long-cache-ttl,
  # modern-image-formats, offscreen-images) no longer exist; see the
  # LIGHTHOUSE_OPPORTUNITIES table in schema.py.
  #
  # This is also where the roadmap's WP Rocket remediation mapping lives.
  # ======================================================================

  - id: lh-render-blocking
    severity: high
    title: "Render-blocking requests delay the page by {lh.opp.render_blocking}"
    detail: >-
      CSS and JavaScript in the document head must download and execute
      before anything appears on screen. Lighthouse estimates the page could
      start rendering {lh.opp.render_blocking} sooner without them.
    when:
      all:
        - {metric: lh.opp.render_blocking, gt: 300}
    impact_ms_from: lh.opp.render_blocking
    effort: medium
    remediation: >-
      Inline the small amount of CSS needed for the first screen and load the
      rest asynchronously; defer every script that is not required to render.
    wp_rocket_setting: "File Optimization > Optimize CSS delivery; Load JavaScript deferred"

  - id: lh-image-delivery
    severity: high
    title: "Images could load {lh.opp.image_delivery} faster"
    detail: >-
      Images are being served larger, in older formats, or less compressed
      than they need to be. On a photo-heavy page this is usually the single
      largest and cheapest win available.
    when:
      all:
        - {metric: lh.opp.image_delivery, gt: 500}
    impact_ms_from: lh.opp.image_delivery
    effort: low
    remediation: >-
      Serve WebP or AVIF at the size the image is actually displayed, and
      lazy-load anything below the fold. Keep the main hero image eager so
      LCP does not get worse.
    wp_rocket_setting: "Media > LazyLoad and Add missing image dimensions; pair with Imagify or ShortPixel for format conversion"

  - id: lh-document-latency
    severity: high
    title: "The document request itself is slow"
    detail: >-
      Lighthouse estimates {lh.opp.document_latency} could be saved on the
      initial HTML request alone: redirects, no compression, or an uncached
      server response. Nothing else on the page can start until it completes.
    when:
      all:
        - {metric: lh.opp.document_latency, gt: 300}
    impact_ms_from: lh.opp.document_latency
    effort: medium
    wp_rocket_setting: "Preload > Preload Cache; check Advanced Rules > Never Cache URL(s)"

  - id: lh-unused-css
    severity: medium
    title: "Unused CSS is costing {lh.opp.unused_css}"
    detail: >-
      Most of the stylesheet is never applied to this page. Page builders and
      multipurpose themes ship every component's CSS on every page.
    when:
      all:
        - {metric: lh.opp.unused_css, gt: 300}
    impact_ms_from: lh.opp.unused_css
    effort: medium
    wp_rocket_setting: "File Optimization > Optimize CSS delivery > Remove Unused CSS"

  - id: lh-unused-js
    severity: medium
    title: "Unused JavaScript is costing {lh.opp.unused_js}"
    detail: >-
      Scripts are downloaded and parsed that this page never uses. Usually a
      CMS loading plugin or theme assets site-wide rather than only where
      needed.
    when:
      all:
        - {metric: lh.opp.unused_js, gt: 300}
    impact_ms_from: lh.opp.unused_js
    effort: medium
    wp_rocket_setting: "File Optimization > Delay JavaScript execution"

  - id: lh-unminified-assets
    severity: medium
    title: "CSS or JavaScript is not minified"
    detail: >-
      Comments and whitespace are being sent to every visitor. Minification
      is automatic and carries essentially no risk of changing behaviour.
    when:
      any:
        - {metric: lh.opp.unminified_css, gt: 150}
        - {metric: lh.opp.unminified_js, gt: 150}
    effort: low
    evidence: [lh.opp.unminified_css, lh.opp.unminified_js]
    wp_rocket_setting: "File Optimization > Minify CSS files and Minify JavaScript files"

  - id: lh-cache-lifetimes
    severity: medium
    title: "Static assets use inefficient cache lifetimes"
    detail: >-
      Images, CSS and JavaScript are being re-downloaded on repeat visits
      because their cache lifetime is short or absent. Lighthouse estimates
      {lh.opp.cache} could be saved.
    when:
      all:
        - {metric: lh.opp.cache, gt: 200}
    impact_ms_from: lh.opp.cache
    effort: low
    remediation: >-
      Set a long max-age (a year is standard) on fingerprinted static assets
      at the server or CDN.
    wp_rocket_setting: "WP Rocket writes browser caching rules to .htaccess on Apache; on nginx set expires headers in the server config"

  - id: lh-lcp-discovery
    severity: medium
    title: "The main image is discovered too late"
    detail: >-
      The browser cannot find the largest above-the-fold image until late in
      the load, costing {lh.opp.lcp_discovery}. Usually caused by lazy-loading
      the hero image or loading it from CSS or JavaScript.
    when:
      all:
        - {metric: lh.opp.lcp_discovery, gt: 200}
    impact_ms_from: lh.opp.lcp_discovery
    effort: low
    remediation: >-
      Put the hero image in the HTML with fetchpriority="high", and exclude
      it from lazy-loading.
    wp_rocket_setting: "Media > Excluded images or iframes (add the hero image)"

  - id: lh-third-parties
    severity: medium
    title: "Third-party scripts are slowing the page by {lh.opp.third_parties}"
    detail: >-
      Chat widgets, tag managers, analytics, heatmaps and ad scripts run on
      the same main thread as your site. Each one is someone else's code
      deciding how fast your page feels.
    when:
      all:
        - {metric: lh.opp.third_parties, gt: 400}
    impact_ms_from: lh.opp.third_parties
    effort: medium
    wp_rocket_setting: "File Optimization > Delay JavaScript execution (add the third-party domains)"

  - id: lh-legacy-javascript
    severity: low
    title: "Legacy JavaScript is shipped to modern browsers"
    detail: >-
      Polyfills and transpiled code for browsers nobody uses any more,
      costing {lh.opp.legacy_javascript}. Comes from a theme, plugin, or
      bundler configuration targeting very old browsers.
    when:
      all:
        - {metric: lh.opp.legacy_javascript, gt: 150}
    impact_ms_from: lh.opp.legacy_javascript
    effort: high

  - id: lh-font-display
    severity: low
    title: "Webfonts block text from appearing"
    detail: >-
      Text stays invisible while a custom font downloads, costing
      {lh.opp.font_display}. A font-display value lets the browser show text
      immediately in a fallback face.
    when:
      all:
        - {metric: lh.opp.font_display, gt: 100}
    impact_ms_from: lh.opp.font_display
    effort: low
    remediation: "Add font-display: swap to every @font-face rule, and preload the fonts used above the fold."
    wp_rocket_setting: "Preload > Fonts preloading"

  - id: lh-huge-page-weight
    severity: medium
    title: "The page weighs {lh.total_bytes}"
    detail: >-
      Total transfer size across every request. Anything past a couple of
      megabytes is painful on mobile data and is usually dominated by images
      or an unbounded number of third-party scripts.
    when:
      all:
        - {metric: lh.total_bytes, gt: 3000000}
    effort: medium
    evidence: [lh.total_bytes, lh.opp.image_delivery, lh.opp.third_parties]

  - id: lh-heavy-main-thread
    severity: medium
    title: "The main thread is busy for {lh.mainthread_work}"
    detail: >-
      While the main thread is working, the page cannot respond to taps or
      clicks. This is what a visitor experiences as the page feeling stuck.
    when:
      all:
        - {metric: lh.mainthread_work, gt: 4000}
    impact_ms_from: lh.mainthread_work
    effort: high
    wp_rocket_setting: "File Optimization > Delay JavaScript execution"

  # --- Non-performance categories ---------------------------------------

  - id: lh-accessibility-poor
    severity: medium
    title: "Accessibility score is {lh.score.accessibility} out of 100"
    detail: >-
      Automated checks found issues that affect people using screen readers,
      keyboard navigation, or high-contrast displays. Automated testing
      catches perhaps a third of real accessibility problems, so treat this
      as a floor rather than a verdict.
    when:
      all:
        - {metric: lh.score.accessibility, lt: 90}
    effort: medium
    evidence: [lh.score.accessibility]

  - id: lh-seo-poor
    severity: medium
    title: "SEO score is {lh.score.seo} out of 100"
    detail: >-
      Lighthouse's SEO checks cover the mechanical basics: meta description,
      crawlability, link text, viewport. These are not rankings, but failing
      them makes everything else harder.
    when:
      all:
        - {metric: lh.score.seo, lt: 90}
    effort: low
    evidence: [lh.score.seo]

  - id: lh-best-practices-poor
    severity: low
    title: "Best Practices score is {lh.score.best_practices} out of 100"
    detail: >-
      Covers console errors, deprecated APIs, insecure requests, and image
      aspect ratios.
    when:
      all:
        - {metric: lh.score.best_practices, lt: 90}
    effort: low
    evidence: [lh.score.best_practices]

  # --- Measurement quality ----------------------------------------------
  # The roadmap's instruction: if the spread is wide, say so on the report
  # rather than hiding it.

  - id: lh-unstable-measurement
    severity: info
    title: "Lab measurements varied noticeably between runs"
    detail: >-
      Across {lh.runs} runs the performance score moved by
      {lh.score.performance.spread} points and LCP by {lh.lcp.spread}. The
      figures below are the median, which is the honest number, but treat
      small differences against a previous audit with caution.
    when:
      any:
        - {metric: lh.score.performance.spread, gt: 10}
        - {metric: lh.lcp.spread, gt: 1500}
    effort: none
    evidence: [lh.runs, lh.score.performance.spread, lh.lcp.spread, lh.tbt.spread]

  - id: lh-contended-measurement
    severity: info
    title: "The measuring machine was slow or busy during this audit"
    detail: >-
      Lighthouse's own CPU benchmark scored {lh.benchmark_index} on the
      machine that took these measurements. A low or unstable score inflates
      Total Blocking Time and Time to Interactive, so the lab numbers here
      are likely pessimistic. Field data, where available, is unaffected.
    when:
      any:
        - {metric: lh.benchmark_index, lt: 1000}
        - {metric: lh.benchmark_index.spread, gt: 500}
    effort: none
    evidence: [lh.benchmark_index, lh.benchmark_index.spread, lh.runs]

  # --- Per-page subresources -------------------------------------------
  #
  # These are the rules per-page analysis exists for. A site's home page is
  # usually the one page anyone has looked at since the TLS migration; the
  # old blog post still pulling a hero image over http:// is the one nobody
  # has opened in three years.
  #
  # Note the unit discipline: `mixed.insecure_count` is a COUNT, so the
  # title interpolates it bare. Appending "resources" inside the title text
  # would be fine, but appending a unit the registry also renders gives you
  # "3 resourcesresources". A test scans this file for exactly that.

  - id: mixed-content
    severity: high
    title: "{mixed.insecure_count} resource(s) loaded over plain HTTP"
    detail: >-
      This page is served over HTTPS but pulls {mixed.insecure_count}
      subresource(s) over http://. Browsers block active mixed content
      outright, so a script or stylesheet loaded this way simply does not
      run, and passive mixed content strips the padlock. The URLs are
      {mixed.insecure_urls}.
    when:
      all:
        - {metric: mixed.insecure_count, gt: 0}
    effort: low
    remediation: >-
      Change each URL to https://, or to a protocol-relative path if the
      host supports TLS. If the third-party host has no certificate, find a
      replacement: there is no way to load it securely.
    evidence: [mixed.insecure_count, mixed.insecure_urls, mixed.method]

  - id: many-third-party-origins
    severity: low
    title: "Page loads from {thirdparty.origin_count} third-party origins"
    detail: >-
      Each additional origin costs a DNS lookup, a TCP connection and a TLS
      handshake before its first byte arrives, and each one is code you do
      not control running on your page. The origins are
      {thirdparty.origins}.
    when:
      all:
        - {metric: thirdparty.origin_count, gt: 8}
    effort: medium
    remediation: >-
      Audit what each origin is for. Self-host fonts and small scripts, and
      remove tags for tools nobody reads any more.
    wp_rocket_setting: >-
      Under File Optimization, self-hosting Google Fonts removes one origin
      outright. WP Rocket's "Delay JavaScript execution" also defers
      third-party scripts until interaction.
    evidence: [thirdparty.origin_count, thirdparty.origins]

  - id: form-posts-over-http
    severity: critical
    title: "A form on this page submits over plain HTTP"
    detail: >-
      The page is served over HTTPS but a form's action is an http:// URL,
      so everything typed into it, including passwords and card details, is
      sent across the network in the clear. Browsers show a full-page
      warning on submission.
    when:
      all:
        - {metric: mixed.insecure_forms, gt: 0}
    effort: low
    remediation: Point the form action at https://.
    evidence: [mixed.insecure_forms, mixed.insecure_form_urls]

  # --- Known vulnerabilities ---------------------------------------------
  #
  # Two families, and the split between them is the whole design.
  #
  # `vuln-confirmed-*` fires on versions a BROWSER OBSERVED: Lighthouse read
  # the version out of the running library, or the software announced itself
  # in a generator tag. Those may name a CVE at its real severity.
  #
  # `vuln-possible` fires on versions INFERRED from a ?ver= query string.
  # That value is frequently the WordPress core version rather than the
  # plugin's, a cache-buster, or a hash, and optimisers rewrite it. It is
  # capped at medium, it says how the version was determined, and it asks the
  # client to confirm rather than telling them they are exposed.
  #
  # A confidently wrong CVE in a client report is the worst thing this tool
  # can print, so the asymmetry is deliberate: over-reporting a real problem
  # as "possible" costs a follow-up email, under-reporting a guess as
  # "critical" costs the relationship.

  - id: vuln-confirmed-critical
    severity: critical
    title: "{vuln.confirmed_critical} critical vulnerability(s) in software running on this page: {vuln.confirmed_ids}"
    detail: >-
      A browser read these version numbers out of the running page, so they
      are not guesses. Affected: {vuln.confirmed_detail}.
    when:
      all:
        - {metric: vuln.confirmed_critical, gt: 0}
    effort: medium
    remediation: >-
      Update the named components. If an update is not possible immediately,
      check whether the vulnerable code path is reachable on your site.
    evidence: [vuln.confirmed_critical, vuln.confirmed_detail, vuln.db_generated]

  - id: vuln-confirmed-high
    severity: high
    title: "{vuln.confirmed_high} high-severity vulnerability(s) in software running on this page: {vuln.confirmed_ids}"
    detail: >-
      A browser read these version numbers out of the running page, so they
      are not guesses. Affected: {vuln.confirmed_detail}.
    when:
      all:
        - {metric: vuln.confirmed_high, gt: 0}
        - {metric: vuln.confirmed_critical, lt: 1}
    effort: medium
    remediation: Update the named components to a version past the fix.
    evidence: [vuln.confirmed_high, vuln.confirmed_detail, vuln.db_generated]

  - id: vuln-confirmed-medium
    severity: medium
    title: "{vuln.confirmed_medium} known vulnerability(s) in software running on this page: {vuln.confirmed_ids}"
    detail: >-
      Lower severity, but the version numbers were read from the running
      page rather than guessed. Affected: {vuln.confirmed_detail}.
    when:
      all:
        - {metric: vuln.confirmed_medium, gt: 0}
        - {metric: vuln.confirmed_high, lt: 1}
        - {metric: vuln.confirmed_critical, lt: 1}
    effort: low
    evidence: [vuln.confirmed_medium, vuln.confirmed_detail]

  - id: vuln-possible
    severity: medium
    title: "{vuln.possible_count} component(s) may be running a vulnerable version: {vuln.possible_ids}"
    detail: >-
      These versions were inferred from ?ver= query strings on asset URLs,
      which is the only signal a site publishes and is not always the
      component's real version: WordPress substitutes the core version for
      assets that do not set their own, caching plugins rewrite it, and some
      themes replace it with a hash. Confirm the installed versions before
      acting. Possible matches: {vuln.possible_detail}.
    when:
      all:
        - {metric: vuln.possible_count, gt: 0}
    effort: low
    remediation: >-
      Check the actual installed versions in your admin panel, then update
      anything that matches. Do not treat this as confirmed.
    wp_rocket_setting: >-
      Not a WP Rocket setting. Note that WP Rocket's file optimisation
      rewrites ?ver= strings, which is why this check is inferential on a
      site that uses it.
    evidence: [vuln.possible_count, vuln.possible_detail]

  - id: vuln-not-checked
    severity: info
    title: "Some components could not be checked for known vulnerabilities"
    detail: >-
      {vuln.unchecked_count} detected component(s) have no entry in this
      audit's vulnerability database ({vuln.unchecked_detail}). That is not
      a clean result for them; it means they were not checked. The database
      covers the components with verified CPE mappings in the NIST NVD.
    when:
      all:
        - {metric: vuln.unchecked_count, gt: 0}
    effort: none
    evidence: [vuln.unchecked_count, vuln.unchecked_detail]

  # --- Exposed endpoints --------------------------------------------------
  #
  # Only ever populated when probing was explicitly authorised for the host.

  - id: exposed-secrets
    severity: critical
    title: "{exposure.secrets_count} file(s) containing credentials are publicly readable"
    detail: >-
      These paths returned content matching a configuration file or database
      dump: {exposure.secrets_paths}. Anyone on the internet can download
      them. This
      is not a theoretical exposure; the files were confirmed by their
      contents, not merely by a status code.
    when:
      all:
        - {metric: exposure.secrets_count, gt: 0}
    effort: low
    remediation: >-
      Remove the files from the web root immediately, then rotate every
      credential in them: assume they are already compromised. Configure the
      server to refuse dotfiles and .sql, .bak and .save extensions.
    evidence: [exposure.secrets_count, exposure.secrets_paths]

  - id: exposed-vcs
    severity: critical
    title: "Version-control metadata is publicly readable"
    detail: >-
      {exposure.vcs_paths} is reachable. A .git or .svn directory lets anyone
      reconstruct your entire source tree, including any credentials that
      were ever committed and later removed, because the history keeps them.
    when:
      all:
        - {metric: exposure.vcs_count, gt: 0}
    effort: low
    remediation: >-
      Block the directory at the web server, and stop deploying by pulling a
      repository into the web root. Rotate anything ever committed as a
      secret.
    evidence: [exposure.vcs_count, exposure.vcs_paths]

  - id: exposed-diagnostics
    severity: medium
    title: "Diagnostic endpoints are publicly readable"
    detail: >-
      {exposure.info_paths} is reachable. Server status pages, phpinfo() output
      and debug logs disclose paths, module versions and sometimes request
      contents, which is reconnaissance handed over for free.
    when:
      all:
        - {metric: exposure.info_count, gt: 0}
    effort: low
    remediation: Restrict these paths to localhost, or remove them.
    evidence: [exposure.info_count, exposure.info_paths]

  - id: exposed-wp-surface
    severity: low
    title: "WordPress exposes more attack surface than it needs to"
    detail: >-
      {exposure.wp_surface_paths} is reachable. xmlrpc.php enables password
      brute-force
      amplification and pingback-based traffic reflection; the REST users
      endpoint lists valid usernames, which halves the work of a
      brute-force attempt.
    when:
      all:
        - {metric: exposure.wp_surface_count, gt: 0}
    effort: low
    remediation: >-
      Disable XML-RPC if nothing uses it, and restrict the REST users
      endpoint to authenticated requests.
    evidence: [exposure.wp_surface_count, exposure.wp_surface_paths]

  - id: probe-inconclusive
    severity: info
    title: "This site returns success for paths that do not exist"
    detail: >-
      A request for a randomly generated path returned
      {exposure.control_status} instead of a 404, so the endpoint probe
      cannot distinguish a real file from a catch-all response. Findings
      were confirmed by content rather than status, which is reliable, but
      absence of findings is weaker evidence here than usual.
    when:
      all:
        - {metric: exposure.soft_404, is: true}
    effort: none
    evidence: [exposure.control_status, exposure.checked]

  - id: probe-blocked-by-firewall
    severity: info
    title: "A firewall answered the endpoint probe"
    detail: >-
      A web application firewall responded instead of the origin server, so
      the probe was stopped rather than continued: every path would have
      returned the same block page and reporting those as findings would be
      wrong. The origin may still be exposing these files to anything that
      reaches it directly.
    when:
      all:
        - {metric: exposure.waf_detected, is: true}
    effort: none
    evidence: [exposure.waf_detected]

  # --- Field-data history -------------------------------------------------
  #
  # Both rules fire on a THRESHOLD CROSSING, not on a raw delta. A site whose
  # LCP went 1.2s -> 2.4s doubled and still passes; one that went 2.4s -> 2.6s
  # barely moved and now fails. Only the second is worth a client's attention,
  # and only a threshold comparison tells them apart.

  - id: crux-history-regression
    severity: high
    title: "Real-user performance has regressed since {crux.history.first_period}"
    detail: >-
      {crux.history.regressed_metrics} was within Google's "good" threshold at
      the start of the {crux.history.weeks}-week window and is outside it now.
      This is measured on your actual visitors, not in a lab, so it reflects
      what people experienced. Each data point is a 28-day average, so the
      change began earlier than the chart appears to show.
    when:
      all:
        - {metric: crux.history.regressed, is: true}
    effort: varies
    remediation: >-
      Compare what shipped during this window. The lab findings in this report
      are the most likely causes; fix those first and the field data will
      follow within about four weeks.
    evidence: [crux.history.regressed_metrics, crux.history.weeks,
               crux.history.lcp.first, crux.history.lcp.delta]

  - id: crux-history-improvement
    severity: info
    title: "Real-user performance has improved since {crux.history.first_period}"
    detail: >-
      {crux.history.improved_metrics} was outside Google's "good" threshold at
      the start of the {crux.history.weeks}-week window and is within it now.
      Measured on your actual visitors rather than in a lab, so this is
      evidence the work landed, not a projection.
    when:
      all:
        - {metric: crux.history.improved, is: true}
    effort: none
    evidence: [crux.history.improved_metrics, crux.history.weeks,
               crux.history.lcp.first, crux.history.lcp.delta]
