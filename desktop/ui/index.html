<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLAP</title>
<!--
  One file, no bundler, no framework: the decision the web UI recorded and
  this app kept. A hash router swaps views; every view is drawn from data
  the Rust commands return. Opened outside the app shell (no Tauri IPC) it
  says so rather than erroring.

  Design rules carried from the report (templates/report/report.css) and
  the ui-redesign notes:
    - The SITE is the primary object, not the batch.
    - Status colour never carries meaning alone. Every severity badge
      prints its status WORD beside the dot, because serious (#ec835a) and
      warning (#fab219) sit too close to tell apart and both fail contrast
      on a light surface. Do not "tidy away" the words.
    - One series means no legend; the heading names it.
    - Dark mode is a chosen set of steps, not an automatic invert.
-->
<style>
  :root {
    --bg: #f4f3ee;
    --surface: #fcfcfb;
    --surface-2: #f4f4f0;
    --line: #e1e0d9;
    --line-strong: #c3c2b7;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #898781;
    --accent: #2a78d6;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --muted-status: #898781;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(11,11,11,.05), 0 1px 8px rgba(11,11,11,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c;
      --surface: #191d26;
      --surface-2: #10131a;
      --line: #2a3040;
      --line-strong: #3a4155;
      --ink: #eef1f6;
      --ink-2: #aab3c5;
      --ink-3: #7c869b;
      --accent: #5ab0f0;
      --good: #35c135;
      --warning: #f7c04a;
      --serious: #f0966a;
      --critical: #e8635f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14.5px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-columns: 232px 1fr;
    grid-template-rows: 1fr;
  }
  a { color: inherit; text-decoration: none; }

  /* ---- sidebar ---- */
  nav.side {
    background: var(--surface-2);
    border-right: 1px solid var(--line);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 100vh;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 0 8px 18px;
  }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    display: block; object-fit: cover;
  }
  .brand b { font-size: 18px; letter-spacing: .06em; }
  nav.side a.item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; color: var(--ink-2);
    font-weight: 500; cursor: pointer;
  }
  nav.side a.item:hover { background: var(--surface); color: var(--ink); }
  nav.side a.item.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  nav.side a.item .ico { width: 18px; text-align: center; opacity: .8; }
  nav.side .spacer { flex: 1; }
  nav.side .foot { padding: 8px; color: var(--ink-3); font-size: 12px; }

  /* ---- main ---- */
  main { min-width: 0; padding: 26px 30px 60px; overflow-y: auto; height: 100vh; }
  .crumbs { color: var(--ink-3); font-size: 13px; margin-bottom: 4px; }
  .crumbs a { color: var(--accent); cursor: pointer; }
  h1 { font-size: 23px; margin: 2px 0 4px; }
  h2 { font-size: 16px; margin: 26px 0 12px; }
  .lead { color: var(--ink-2); margin: 0 0 18px; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .pad { padding: 16px 18px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); font-weight: 600; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---- status badges: colour + WORD, always ---- */
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted-status); }
  .s-critical .dot { background: var(--critical); } .s-critical { color: var(--critical); }
  .s-high .dot     { background: var(--serious); }  .s-high { color: var(--serious); }
  .s-medium .dot   { background: var(--warning); }
  .s-low .dot, .s-info .dot { background: var(--muted-status); }
  .s-good .dot     { background: var(--good); }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2);
  }
  .muted { color: var(--ink-3); }

  .grid { display: grid; gap: 14px; }
  .cols-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 780px) { .cols-3 { grid-template-columns: 1fr; } body { grid-template-columns: 64px 1fr; } .brand b, nav.side a.item span.lbl, nav.side .foot { display: none; } }

  .tile .k { color: var(--ink-3); font-size: 12.5px; text-transform: uppercase; letter-spacing: .03em; }
  .tile .v { font-size: 26px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .sub { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }

  .finding { border-left: 3px solid var(--muted-status); background: var(--surface); border: 1px solid var(--line); border-left-width: 3px; border-radius: 8px; padding: 12px 15px; margin-bottom: 10px; }
  .finding.critical { border-left-color: var(--critical); }
  .finding.high     { border-left-color: var(--serious); }
  .finding.medium   { border-left-color: var(--warning); }
  .finding.low, .finding.info { border-left-color: var(--muted-status); }
  .finding .title { font-weight: 650; }
  .finding .detail { color: var(--ink-2); margin-top: 4px; }
  .finding .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .wprocket { margin-top: 8px; font-size: 13px; background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 6px; padding: 7px 10px; }
  .wprocket b { color: var(--accent); }

  button.primary {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.05); }
  button.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 14px; font-weight: 600; cursor: pointer; }
  textarea { width: 100%; min-height: 150px; resize: vertical; padding: 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .notice { border-radius: 8px; padding: 12px 15px; margin-top: 14px; font-size: 13.5px; }
  .notice.info { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .notice.warn { background: color-mix(in srgb, var(--warning) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warning) 45%, var(--line)); }
  .empty { text-align: center; color: var(--ink-3); padding: 54px 20px; }
  .empty .big { font-size: 40px; opacity: .5; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 7px 20px; margin: 0; }
  dl.kv dt { color: var(--ink-3); }
  dl.kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  svg.spark { display: block; }
  .row-actions { display: flex; gap: 10px; align-items: center; margin: 6px 0 18px; flex-wrap: wrap; }
  .seg { font-size: 12.5px; color: var(--ink-3); }

  /* ---- composer: Lighthouse coverage and the estimate ---- */
  .scope-choice { display: grid; gap: 8px; margin: 4px 0 6px 24px; }
  .scope-choice label { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .scope-choice label b { color: var(--ink); font-weight: 600; }
  .scope-choice input { margin-top: 3px; }
  .estimate { font-size: 13px; color: var(--ink-2); margin: 2px 0 0 24px; }
  .estimate b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .confirm { margin-top: 14px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 14px 16px; background: var(--surface-2); }
  .confirm .big { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .confirm table td, .confirm table th { padding: 6px 10px; font-size: 12.5px; }
  .confirm tbody tr { cursor: default; }
  details.sites summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 8px; }

  /* ---- the activity dock ---- */
  .dock {
    position: fixed; right: 18px; bottom: 18px; width: 380px; max-width: calc(100vw - 36px);
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px;
    box-shadow: 0 6px 30px rgba(11,11,11,.14); z-index: 20; font-size: 13px; overflow: hidden;
  }
  .dock[hidden] { display: none; }
  .dock .dock-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .dock .dock-head b { flex: 1; font-size: 13.5px; }
  .dock .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; flex: none; }
  .dock.done .pulse { animation: none; background: var(--good); }
  .dock.stopped .pulse { animation: none; background: var(--warning); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  /* minmax(0, 1fr): a long unbroken page URL must ellipsise, not widen the
   * grid and push the counts out of the panel. */
  .dock .dock-body { padding: 10px 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 9px; }
  .dock.collapsed .dock-body { display: none; }
  .dock button { padding: 6px 12px; font-size: 12.5px; }

  /* ---- progress, shared by the dock and the panel under Run audit ---- */
  .progress-card { margin-top: 16px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 14px 16px; background: var(--surface-2); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; font-size: 13.5px; }
  .progress-card[hidden] { display: none; }
  .progress-card .head { display: flex; align-items: center; gap: 9px; }
  .progress-card .head b { flex: 1; font-size: 15px; }
  .progress-card .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; flex: none; }
  .progress-card.done .pulse { animation: none; background: var(--good); }
  .progress-card.stopped .pulse { animation: none; background: var(--warning); }
  .phase-row { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .phase-row > span:first-child { color: var(--ink); font-weight: 600; }
  .phase-row b, .row b { color: var(--ink); }
  .pbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 6px 0 5px; }
  .pbar > div { height: 100%; background: var(--accent); width: 0%; transition: width .3s; }
  .progress-card.done .pbar > div { background: var(--good); }
  .now { font: 12px/1.45 ui-monospace, Consolas, monospace; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rows { display: grid; gap: 4px; }
  .row { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .log { font: 11.5px/1.45 ui-monospace, Consolas, monospace; color: var(--ink-3); overflow: hidden; border-top: 1px solid var(--line); padding-top: 7px; }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .dock .phase .pbar { height: 7px; }
</style>
</head>

<script>
"use strict";

const TAURI = window.__TAURI__;
const hasIPC = !!(TAURI && TAURI.core && TAURI.core.invoke);
const invoke = (cmd, args) => hasIPC ? TAURI.core.invoke(cmd, args)
  : Promise.reject(new Error("not running inside the SLAP app shell (no IPC)"));

const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined)
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return node;
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));

const SEVERITY = {
  critical: { word: "Critical", cls: "s-critical" },
  high:     { word: "High",     cls: "s-high" },
  medium:   { word: "Medium",   cls: "s-medium" },
  low:      { word: "Low",      cls: "s-low" },
  info:     { word: "Info",     cls: "s-info" },
};
const sev = (s) => SEVERITY[s] || { word: s || "—", cls: "s-info" };
function badge(severity) {
  const { word, cls } = sev(severity);
  return el("span", { class: "badge " + cls }, el("span", { class: "dot" }), word);
}

// Light client-side formatting for the few metrics a report strip shows.
// The heavy formatting already happened server-side in finding text; this is
// only for raw observation values.
function fmt(key, value) {
  if (value === null || value === undefined) return "—";
  const n = Number(value);
  if (key.endsWith(".p75") && key.includes("cls")) return n.toFixed(2);
  if (key.startsWith("lh.score")) return String(Math.round(n));
  if (key.includes("lcp") || key.includes("inp") || key.includes("ttfb") || key.startsWith("lh.")) {
    if (!Number.isFinite(n)) return String(value);
    return n >= 1000 ? (n / 1000).toFixed(1) + "s" : Math.round(n) + "ms";
  }
  return String(value);

function ago(iso) {

    if (p.v === null || p.v === undefined || !Number.isFinite(p.v)) { i++; continue; }

    out.replaceChildren(el("div", { class: "notice info" }, "Counting pages… (discovery only; nothing is measured yet)"));
    try {
      const [est, power] = await Promise.all([
        invoke("estimate_audit", { urls, scope: scopeNow() }),
        invoke("power_status").catch(() => ({})),
      ]);
      const capped = est.sites.filter(x => x.dropped > 0);
      const failed = est.sites.filter(x => x.error);
      const startBtn = el("button", { class: "primary" }, "Start audit");
      startBtn.addEventListener("click", () => start(urls));
      const back = el("button", { class: "ghost", onclick: () => out.replaceChildren() }, "Back");
      const rows = est.sites.map(x => el("tr", {},
        el("td", {}, x.url),
        el("td", { class: "num" }, x.error ? "—" : num(x.pages)),
        el("td", { class: "num" }, x.error ? el("span", { class: "muted" }, x.error) : num(x.found)),
        el("td", { class: "num" }, num(x.lighthouse_pages))));
      out.replaceChildren(el("div", { class: "confirm" },
        el("div", { class: "big" }, `${num(est.lighthouse_pages)} pages, about ${duration(est.seconds)}`),
        el("div", { class: "muted", style: "margin-top:2px" },
          `${num(est.sites.length)} site${est.sites.length === 1 ? "" : "s"}, ${est.concurrency} pages at a time, ${runsEach(est.runs_per_page)}. `
          + `About ${bytes(est.disk_bytes)} on disk` + (s.keep_lhr ? ", full Lighthouse reports included (Settings → Lighthouse)." : ".")),
        capped.length ? el("div", { class: "notice info" },
          `${capped.length} site${capped.length === 1 ? " has" : "s have"} more pages than the per-site cap of ${pagesCap}. `
          + "Those pages are left out, and each report says how many.") : null,
        failed.length ? el("div", { class: "notice warn" }, `${failed.length} URL(s) could not be read and will fail.`) : null,
        power && power.on_battery ? el("div", { class: "notice warn" },
          el("b", {}, "This machine is on battery. "),
          "Plug it in for a long batch: on battery the OS slows the CPU, which makes lab numbers worse and less consistent from page to page, and a laptop that sleeps stops the audit.") : null,
        el("p", { class: "muted", style: "font-size:12.5px;margin:12px 0 0" },
          "The machine is kept awake while the audit runs. If it stops anyway (a closed lid, a crash, the Stop button), every page measured so far is saved and the rest can be resumed from this screen."),
        el("details", { class: "sites" }, el("summary", {}, "Pages per site"),
          el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Site"), el("th", { class: "num" }, "Pages"), el("th", { class: "num" }, "Found"), el("th", { class: "num" }, "Lighthouse"))),
            el("tbody", {}, ...rows))),
        el("div", { class: "row-actions", style: "margin:14px 0 0" }, startBtn, back)));
    } catch (e) {
      out.replaceChildren(el("div", { class: "notice warn" }, errText(e)));
    } finally {
      run.disabled = false;
    }
  }

  run.addEventListener("click", () => {
    const urls = urlsNow();
    out.replaceChildren();
    if (!urls.length) { out.append(el("div", { class: "notice warn" }, "Add at least one URL first.")); return; }
    if (dock.active()) { out.append(el("div", { class: "notice warn" }, "An audit is already running. Stop it or wait for it to finish.")); return; }
    if (lighthouse.checked && scopeNow() === "every_page") confirmEveryPage(urls);
    else start(urls);
  });

  // Audits that did not finish: resume them in place, or close them.
  async function loadUnfinished() {
    unfinishedBox.replaceChildren();
    let data;
    try { data = await invoke("unfinished_runs"); } catch { return; }
    const list = (data && data.runs) || [];
    if (data.active || !list.length) return;
    const ids = list.map(r => r.id);
    const planned = list.reduce((a, r) => a + (r.lh_planned || 0), 0), done = list.reduce((a, r) => a + (r.lh_done || 0), 0);
    const resume = el("button", { class: "primary" }, list.length === 1 ? "Resume" : `Resume all ${list.length}`);
    const discard = el("button", { class: "ghost" }, "Discard");
    const msg = el("div", { class: "muted", style: "font-size:12px" });
    resume.addEventListener("click", async () => {
      if (dock.active()) { msg.textContent = "An audit is already running. Resume once it has finished or been stopped."; return; }
      resume.disabled = discard.disabled = true;
      unfinishedBox.replaceChildren();
      dock.begin(`Resuming ${list.length} run${list.length === 1 ? "" : "s"}`, { lighthouse: list.some(r => r.lh_scope), resume: true });
      try { out.replaceChildren(summaryNotice(await invoke("resume_audit", { runIds: ids }))); }
      catch (e) { dock.fail(errText(e)); out.replaceChildren(el("div", { class: "notice warn" }, errText(e))); }
      finally { loadUnfinished(); }
    });
    discard.addEventListener("click", async () => {
      resume.disabled = discard.disabled = true;
      try { await invoke("discard_runs", { runIds: ids }); loadUnfinished(); }
      catch (e) { msg.textContent = errText(e); resume.disabled = discard.disabled = false; }
    });
    const lines = list.slice(0, 8).map(r => el("li", {},
      el("b", {}, r.hostname), " — ",
      r.page_count ? (r.lh_planned ? `${num(r.lh_done)} of ${num(r.lh_planned)} pages measured` : `${num(r.page_count)} pages, finishing`) : "not started",
      el("span", { class: "muted" }, "  " + ago(r.started_at))));
    if (list.length > 8) lines.push(el("li", { class: "muted" }, `and ${list.length - 8} more`));
    unfinishedBox.append(el("div", { class: "notice warn", style: "margin:0 0 14px" },
      el("b", {}, `${list.length} audit${list.length === 1 ? "" : "s"} did not finish`),
      planned ? ` — ${num(done)} of ${num(planned)} Lighthouse pages are saved.` : ".",
      el("ul", { style: "margin:8px 0 4px;padding-left:20px" }, ...lines),
      el("div", { class: "muted", style: "font-size:12.5px" },
        "Resuming keeps every page already measured and finishes the rest, as long as the same Lighthouse and Chrome are installed. A run measured by a different engine is started again as a new run, so no report mixes two."),
      el("div", { class: "row-actions", style: "margin:10px 0 0" }, resume, discard), msg));
  }

  refresh();
  loadUnfinished();
  mount(head, unfinishedBox, el("div", { class: "card pad" }, box, opts,
    el("div", { class: "row-actions", style: "margin-top:14px" }, run, el("span", { class: "seg" }, "Runs locally. No account, nothing uploaded.")),
    progressBox, out));
  // Coming back to this screen mid-audit shows its progress here again.
  if (dock.active()) { run.disabled = true; run.textContent = "Running…"; }
  dock.render();
}

function summaryNotice(summary) {
  const parts = [`${summary.succeeded} ok`];
  if (summary.failed) parts.push(`${summary.failed} failed`);
  if (summary.interrupted) parts.push(`${summary.interrupted} stopped before finishing`);
  return el("div", { class: "notice info" },
    el("b", {}, `Audited ${summary.total} site${summary.total === 1 ? "" : "s"}: ` + parts.join(", ")),
    summary.interrupted ? el("div", { style: "margin-top:4px" }, "Everything measured so far is saved. Resume the rest from New audit.") : null,
    el("div", { style: "margin-top:8px" }, el("button", { class: "ghost", onclick: () => go("sites") }, "View sites →")));
}

// -------- audit progress: the dock, and the panel under Run audit --------
// One listener on slap://progress for as long as the app is open, one state,
// two views of it: the panel under the Run button on New audit, and the dock
// in the corner everywhere else (so a batch hours long can be watched from any
// screen). Progress comes in two phases. Scanning fetches every discovered
// page (seconds a page, a few at a time); Lighthouse then measures the pages
// its coverage mode selects (about 30s a page, 3 at a time).
const dock = (() => {
  const node = document.getElementById("dock");
  let st = null, defaults = { runs: 3, conc: 3, perRun: 30 }, timer = null;
  const fresh = (title, opts = {}) => ({
    title, batch: null, state: "running", stopping: false, collapsed: false, error: null,
    lighthouse: !!opts.lighthouse, resume: !!opts.resume,
    sitesTotal: 0, sitesDone: 0, sitesDiscovered: 0, sitesPlanned: 0,
    scanTotal: 0, scanned: 0, scanFailed: 0, scanning: new Map(), lastScanned: null,
    lhPlanned: 0, lhAlready: 0, lhDone: 0, lhFailed: 0,
    firstPageAt: null, inChrome: new Map(), log: [],
  });
  const path = (u) => { try { const x = new URL(u); return x.host + (x.pathname === "/" ? "" : x.pathname); } catch { return u; } };
  function note(text) { st.log.unshift(text); st.log.length = Math.min(st.log.length, 6); }
  // Neither may clobber a batch that is already reporting progress: its
  // events, not a second button press, own the panel until it finishes.
  const live = () => !!(st && st.state === "running" && st.batch);
  function begin(title, opts) { if (live()) return; st = fresh(title, opts); render(); }
  function fail(message) {
    if (live()) { note("✕ " + message); render(); return; }
    if (!st) st = fresh("Audit");
    st.state = "stopped"; st.error = message; render();
  }
  function active() { return !!(st && st.state === "running"); }
  function onEvent(e) {
    if (!e || !e.type) return;
    if (e.type === "batch_started") {
      if (!(st && st.state === "running" && !st.batch)) st = fresh("", { resume: e.batch_id.startsWith("resume") });
      st.batch = e.batch_id; st.sitesTotal = e.total;
      if (e.batch_id.startsWith("resume")) st.resume = true;
      if (!st.title) st.title = (st.resume ? "Resuming " : "Auditing ") + e.total + (e.total === 1 ? " site" : " sites");
    }
    if (!st) st = fresh("Audit in progress");
    switch (e.type) {
      case "site_started": note(`started ${path(e.url)}`); break;
      case "pages_discovered":
        st.sitesDiscovered++; st.scanTotal += e.pages;
        note(`${path(e.url)}: ${e.pages} page${e.pages === 1 ? "" : "s"} to scan` + (e.dropped ? ` (${e.found} found, cap ${e.pages})` : ""));
        break;
      case "page_scan_started": st.scanning.set(e.page_url, Date.now()); break;
      case "page_scanned":
        st.scanning.delete(e.page_url); st.scanned++; st.lastScanned = e.page_url;
        if (!e.ok) { st.scanFailed++; note(`✕ ${path(e.page_url)} did not load`); }
        break;
      case "pages_planned":
        st.sitesPlanned++; st.lhPlanned += e.lighthouse_pages; st.lhAlready += e.lighthouse_done;
        if (e.lighthouse_pages) { st.lighthouse = true; note(`${path(e.url)}: ${e.lighthouse_pages - e.lighthouse_done} page${e.lighthouse_pages - e.lighthouse_done === 1 ? "" : "s"} queued for Lighthouse`); }
        break;
      case "page_started":
        if (!st.firstPageAt) st.firstPageAt = Date.now();
        st.inChrome.set(e.page_url, Date.now()); break;
      case "page_finished":
        st.inChrome.delete(e.page_url); st.lhDone++;
        if (!e.ok) { st.lhFailed++; note(`✕ ${path(e.page_url)}: Lighthouse failed`); }
        else note(`${path(e.page_url)}: performance ${e.performance == null ? "—" : Math.round(e.performance)}`);
        break;
      case "site_finished": st.sitesDone++; note(`${e.ok ? "✓" : "✕"} ${path(e.url)}${e.ok ? "" : " failed"}`); break;
      case "log_message": note(e.text); break;
      case "batch_finished":
        st.state = e.cancelled ? "stopped" : "done"; st.inChrome.clear(); st.scanning.clear();
        note(e.cancelled ? "stopped: the rest can be resumed" : `finished: ${e.succeeded} ok, ${e.failed} failed`);
        break;
    }
    render();
  }
  function eta() {
    const left = Math.max(0, st.lhPlanned - st.lhAlready - st.lhDone);
    const unplanned = Math.max(0, st.sitesTotal - st.sitesPlanned);
    const perSite = st.sitesPlanned ? st.lhPlanned / st.sitesPlanned : null;
    const remaining = left + (perSite == null ? 0 : unplanned * perSite);
    // The configured pace until the batch has a few minutes of its own
    // history; then its own throughput, which includes this machine's speed.
    let rate = defaults.conc / (defaults.runs * defaults.perRun);
    const elapsed = st.firstPageAt ? (Date.now() - st.firstPageAt) / 1000 : 0;
    if (st.lhDone >= 3 && elapsed >= 120) rate = st.lhDone / elapsed;
    return { remaining, secs: remaining / rate, approx: unplanned > 0 };
  }
  // The two phases' numbers, shared by both views.
  function phases() {
    const more = (seen) => seen < st.sitesTotal ? "+" : "";
    const scanPct = st.scanTotal ? Math.min(100, 100 * st.scanned / st.scanTotal) : 0;
    const lhPlanned = st.lhPlanned - st.lhAlready;
    const lhPct = lhPlanned > 0 ? Math.min(100, 100 * st.lhDone / lhPlanned) : 0;
    // Scanning shows whenever a light pass runs (every fresh site has one); a
    // resume of runs already scanned goes straight to Lighthouse.
    const showScan = st.scanTotal > 0 || (!st.resume && st.state === "running");
    const showLh = st.lighthouse || st.lhPlanned > 0;
    const overall = showLh && lhPlanned > 0 ? lhPct : (st.scanTotal ? scanPct : (st.sitesTotal ? 100 * st.sitesDone / st.sitesTotal : 0));
    return { more, scanPct, lhPlanned, lhPct, showScan, showLh, overall };
  }
  // One phase: a label and count, a bar, and the page(s) it is on now.
  function phaseEl(label, count, pct, nowLabel, nowPages, idle) {
    return el("div", { class: "phase" },
      el("div", { class: "phase-row" }, el("span", {}, label), el("span", {}, count)),
      el("div", { class: "pbar" }, el("div", { style: `width:${pct.toFixed(1)}%` })),
      nowPages.length
        ? el("div", { class: "now" }, el("span", { class: "muted" }, nowLabel + " "), ...nowPages.slice(0, 3).map((u, i) => el("span", {}, (i ? ", " : "") + path(u))),
            nowPages.length > 3 ? el("span", { class: "muted" }, ` and ${nowPages.length - 3} more`) : null)
        : (idle ? el("div", { class: "now muted" }, idle) : null));
  }
  function body(inline) {
    const p = phases();
    const parts = [];
    if (st.error) parts.push(el("div", { class: "notice warn", style: "margin:0" }, st.error));
    if (p.showScan) {
      const count = st.scanTotal
        ? el("span", {}, "Page ", el("b", {}, num(Math.min(st.scanned, st.scanTotal))), ` of ${num(st.scanTotal)}${p.more(st.sitesDiscovered)}`, st.scanFailed ? `, ${st.scanFailed} did not load` : "")
        : el("span", { class: "muted" }, "finding pages…");
      const idle = st.scanTotal && st.scanned >= st.scanTotal && st.sitesDiscovered >= st.sitesTotal
        ? "All pages scanned"
        : (st.scanTotal ? (st.lastScanned ? "Last scanned " + path(st.lastScanned) : "") : "Reading robots.txt and sitemaps…");
      parts.push(phaseEl("Scanning pages", count, p.scanPct, "Now scanning", [...st.scanning.keys()], idle));
    }
    if (p.showLh) {
      const count = p.lhPlanned > 0
        ? el("span", {}, "Page ", el("b", {}, num(st.lhDone)), ` of ${num(p.lhPlanned)}${p.more(st.sitesPlanned)}`, st.lhAlready ? ` (${num(st.lhAlready)} saved earlier)` : "", st.lhFailed ? `, ${st.lhFailed} failed` : "")
        : el("span", { class: "muted" }, "waiting for the scan");
      parts.push(phaseEl("Lighthouse", count, p.lhPct, "In Chrome", [...st.inChrome.keys()], null));
    }
    const rows = el("div", { class: "rows" },
      el("div", { class: "row" }, el("span", {}, "Sites"), el("span", {}, el("b", {}, num(st.sitesDone)), ` of ${num(st.sitesTotal || 0)} finished`)));
    if (st.state === "running" && st.lhPlanned) {
      const t = eta();
      const left = duration(t.secs);
      if (t.remaining > 0) rows.append(el("div", { class: "row" }, el("span", {}, "Time left"),
        el("span", {}, el("b", {}, (t.approx && left !== "under a minute" ? "about " : "") + left))));
    }
    parts.push(rows);
    if (st.log.length) parts.push(el("div", { class: "log" }, ...st.log.slice(0, inline ? 4 : 6).map(l => el("div", {}, l))));
    const actions = el("div", { class: "actions" });
    if (st.state === "running") {
      const stop = el("button", { class: "ghost" }, st.stopping ? "Stopping after pages in Chrome…" : "Stop");
      stop.disabled = st.stopping;
      stop.addEventListener("click", async (ev) => {
        ev.stopPropagation(); st.stopping = true; render();
        try { await invoke("stop_audit"); } catch {}
      });
      actions.append(stop);
    } else if (!inline) {
      actions.append(el("button", { class: "ghost", onclick: (ev) => { ev.stopPropagation(); st = null; render(); } }, "Close"));
    }
    if (actions.childNodes.length) parts.push(actions);
    return parts;
  }
  function statusText(p) {
    return st.state === "done" ? "Finished" : st.state === "stopped" ? (st.error ? "Could not run" : "Stopped")
      : (st.stopping ? "Stopping…" : Math.floor(p.overall) + "%");
  }
  function render() {
    const inline = document.getElementById("audit-progress");
    if (inline) {
      if (!st) { inline.hidden = true; }
      else {
        const p = phases();
        inline.hidden = false;
        inline.className = "progress-card" + (st.state === "done" ? " done" : st.state === "stopped" ? " stopped" : "");
        inline.replaceChildren(
          el("div", { class: "head" }, el("span", { class: "pulse" }), el("b", {}, st.title || "Audit"), el("span", { class: "muted" }, statusText(p))),
          ...body(true));
      }
    }
    // The panel under Run audit shows it already; the dock is for every other screen.
    if (!st || inline) { node.hidden = true; return; }
    const p = phases();
    node.hidden = false;
    node.className = "dock" + (st.state === "done" ? " done" : st.state === "stopped" ? " stopped" : "") + (st.collapsed ? " collapsed" : "");
    const headEl = el("div", { class: "dock-head", onclick: () => { st.collapsed = !st.collapsed; render(); } },
      el("span", { class: "pulse" }), el("b", {}, st.title || "Audit"), el("span", { class: "muted" }, statusText(p)));
    node.replaceChildren(headEl, el("div", { class: "dock-body" }, ...body(false)));
  }
  async function init() {
    try {
      const s = await invoke("get_settings");
      defaults = { runs: s.lighthouse_runs || 3, conc: s.lighthouse_concurrency || 3, perRun: s.seconds_per_run || 30 };
    } catch {}
    if (TAURI.event && TAURI.event.listen) await TAURI.event.listen("slap://progress", (e) => onEvent(e.payload));
    try { const a = await invoke("audit_status"); if (a.active && !st) begin("Audit in progress"); } catch {}
    // Switching screens adds or removes the panel under Run audit; the dock follows.
    window.addEventListener("hashchange", () => setTimeout(render, 60));
    timer = setInterval(() => { if (active() && !st.collapsed) render(); }, 15000);
  }
  return { begin, fail, active, onEvent, init, render };
})();

      el("p", {}, "Status: ", status),

    // Report branding: the name and logo shown atop exported HTML/PDF reports.
    const brandMsg = el("div", { class: "muted", style: "font-size:12px;margin-top:8px" });
    const nameInput = el("input", { type: "text", placeholder: "Your company or agency name", value: s.brand_name || "", style: "width:100%;max-width:540px;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px" });
    const nameSave = el("button", { class: "primary" }, "Save name");
    nameSave.addEventListener("click", async () => {
      nameSave.disabled = true; brandMsg.textContent = "Saving…";
      try { await invoke("set_brand_name", { name: nameInput.value }); go("settings"); }
      catch (e) { brandMsg.textContent = String(e && e.message ? e.message : e); nameSave.disabled = false; }
    });
    const setLogo = el("button", { class: "ghost" }, s.brand_logo_set ? "Replace logo…" : "Set logo…");
    setLogo.addEventListener("click", async () => {
      setLogo.disabled = true; brandMsg.textContent = "";
      try {
        const res = await invoke("set_brand_logo");
        if (res && res.changed) { go("settings"); }
        else { brandMsg.textContent = "Cancelled."; setLogo.disabled = false; }
      } catch (e) { brandMsg.textContent = String(e && e.message ? e.message : e); setLogo.disabled = false; }
    });
    const rmLogo = el("button", { class: "ghost" }, "Remove logo");
    rmLogo.disabled = !s.brand_logo_set;
    rmLogo.addEventListener("click", async () => {
      rmLogo.disabled = true; brandMsg.textContent = "";
      try { await invoke("clear_brand_logo"); go("settings"); }
      catch (e) { brandMsg.textContent = String(e && e.message ? e.message : e); rmLogo.disabled = false; }
    });
    const brandCard = el("div", { class: "card pad" },
      el("h2", {}, "Report branding"),
      el("p", { class: "secondary" }, "The name and logo shown at the top of exported HTML and PDF reports. Set either or both; leave both empty for a neutral heading. The logo is embedded in each report, so keep it under 1 MB (PNG, JPEG, GIF, WebP or SVG)."),
      el("p", { class: "muted", style: "margin:2px 0 4px" }, "Brand name"),
      el("div", { style: "margin-bottom:8px" }, nameInput),
      el("div", { class: "row-actions" }, nameSave),
      el("p", { class: "muted", style: "margin:16px 0 6px" }, "Logo — ", s.brand_logo_set ? el("b", { style: "color:var(--good,#0ca30c)" }, "a logo is set") : el("span", {}, "no logo set")),
      el("div", { class: "row-actions" }, setLogo, rmLogo),
      brandMsg);

    // Report content: whether findings carry WP Rocket remediation suggestions.
    const wpToggle = el("input", { type: "checkbox" });
    wpToggle.checked = s.wp_rocket_suggestions !== false; // absent/default is on
    const wpMsg = el("div", { class: "muted", style: "font-size:12px;margin-top:8px" });
    wpToggle.addEventListener("change", async () => {
      wpToggle.disabled = true; wpMsg.textContent = "Saving…";
      try {
        await invoke("set_wp_rocket_suggestions", { enabled: wpToggle.checked });
        wpMsg.textContent = wpToggle.checked
          ? "On: findings show the “In WP Rocket” fix line, here and in reports."
          : "Off: WP Rocket suggestions are hidden here and left out of reports.";
      } catch (e) {
        wpToggle.checked = !wpToggle.checked; // revert on failure
        wpMsg.textContent = String(e && e.message ? e.message : e);
      } finally { wpToggle.disabled = false; }
    });
    // Report content: whether findings carry their "How to fix" advice.
    const fixToggle = el("input", { type: "checkbox" });
    fixToggle.checked = s.fix_advice !== false; // absent/default is on
    const fixMsg = el("div", { class: "muted", style: "font-size:12px;margin-top:8px" });
    fixToggle.addEventListener("change", async () => {
      fixToggle.disabled = true; fixMsg.textContent = "Saving…";
      try {
        await invoke("set_fix_advice", { enabled: fixToggle.checked });
        fixMsg.textContent = fixToggle.checked
          ? "On: reports show the “How to fix” line under each finding that has one."
          : "Off: reports list the problems without “How to fix” advice.";
      } catch (e) {
        fixToggle.checked = !fixToggle.checked; // revert on failure
        fixMsg.textContent = String(e && e.message ? e.message : e);
      } finally { fixToggle.disabled = false; }
    });
    const wpRocketCard = el("div", { class: "card pad" },
      el("h2", {}, "Report content"),
      el("p", { class: "secondary" }, "“How to fix” adds a short line under a finding saying what to change. Turn it off for reports that should state the problems and leave the fixes to be quoted separately. It does not affect the app’s own views."),
      el("label", { class: "seg" }, fixToggle, " Include “How to fix” advice in reports"),
      fixMsg,
      el("p", { class: "secondary", style: "margin-top:16px" }, "WP Rocket suggestions add an “In WP Rocket” line to a finding’s fix, naming the exact plugin setting that addresses it. Turn this off for clients who do not run WP Rocket: the line goes from the findings in this app and from reports. Detection of WP Rocket in the technology section is unaffected."),
      el("label", { class: "seg" }, wpToggle, " Show WP Rocket suggestions"),
      wpMsg);

    // Vulnerability database: regenerate the offline CVE data from the NVD,
    // and optionally save an API key that makes the pull fast.
    const vulndbSummary = (v) => {
      if (!v) return "Status unavailable.";
      const cov = v.covered || {};
      let age = v.generated_at || "unknown";
      const t = Date.parse(v.generated_at || "");
      if (!isNaN(t)) {
        const days = Math.floor((Date.now() - t) / 86400000);
        age = days <= 0 ? "today" : (days === 1 ? "yesterday" : days + " days ago");
      }
      return `${v.cve_count || 0} CVEs from ${v.sources || "NVD"}, generated ${age}. Covers `
        + `${cov.npm || 0} JS libraries, ${cov.wordpress || 0} WordPress core, `
        + `${cov["wordpress-plugin"] || 0} plugins.`;
    };
    const vinfoEl = el("span", {}, vulndbSummary(vinfo));

    const regenMsg = el("div", { style: "margin-top:10px" });
    const progBar = el("div", { style: "height:8px;width:0%;background:var(--accent,#3b6ef5);border-radius:4px;transition:width .25s" });
    const progWrap = el("div", { style: "display:none;margin-top:10px" },
      el("div", { style: "height:8px;background:var(--line,#e3e3e3);border-radius:4px;overflow:hidden" }, progBar),
      el("div", { class: "muted", style: "font-size:12px;margin-top:6px" }));
    const progText = progWrap.lastChild;
    const regenBtn = el("button", { class: "primary" }, "Regenerate now");

    regenBtn.addEventListener("click", async () => {
      regenBtn.disabled = true;
      regenMsg.innerHTML = "";
      progWrap.style.display = "block";
      progBar.style.width = "0%";
      progText.textContent = "Starting… this takes several minutes without an API key.";
      let unlisten = null;
      try {
        if (TAURI.event && TAURI.event.listen) {
          unlisten = await TAURI.event.listen("slap://vulndb-progress", (e) => {
            const p = e.payload || {};
            if (p.total) progBar.style.width = Math.round((100 * p.done) / p.total) + "%";
            progText.textContent = p.label === "done"
              ? "Saving the database…"
              : `Querying ${p.label}… (${p.done}/${p.total})`;
          });
        }
        const res = await invoke("regenerate_vulndb");
        progBar.style.width = "100%";
        const cov = res.covered || {};
        vinfoEl.textContent = vulndbSummary({
          cve_count: res.cve_count, generated_at: res.generated_at, covered: cov, sources: "NIST NVD",
        });
        regenMsg.append(el("div", { class: "notice info" },
          el("b", {}, `Database updated: ${res.cve_count} CVEs`),
          el("div", { style: "margin-top:4px" },
            `Now covering ${cov.npm || 0} JS libraries, ${cov.wordpress || 0} WordPress core, `
            + `${cov["wordpress-plugin"] || 0} plugins. In effect from your next audit.`)));
      } catch (e) {
        regenMsg.append(el("div", { class: "notice warn" }, String(e && e.message ? e.message : e)));
      } finally {
        if (unlisten) unlisten();
        regenBtn.disabled = false;
        progWrap.style.display = "none";
      }
    });

    const nvdStatus = s.nvd_key_from_env
      ? el("span", {}, el("b", {}, "Set from the NVD_API_KEY environment variable"), el("span", { class: "muted" }, " — that overrides anything saved here"))
      : (s.nvd_key_set
        ? el("b", { style: "color:var(--good,#0ca30c)" }, "A key is saved")
        : el("span", { class: "muted" }, "No key — regeneration still works, but takes ~10 minutes"));
    const nvdInput = el("input", { type: "password", autocomplete: "off", placeholder: "Paste an optional NVD API key (makes regeneration ~90s)", style: "width:100%;max-width:540px" });
    const nvdOut = el("div", { class: "muted", style: "font-size:12px;margin-top:8px" });
    const nvdSave = el("button", { class: "ghost" }, "Save key");
    const nvdClear = el("button", { class: "ghost" }, "Remove key");
    nvdSave.addEventListener("click", async () => {
      const key = nvdInput.value.trim();
      if (!key) { nvdOut.textContent = "Enter a key first, or use Remove key."; return; }
      nvdSave.disabled = true; nvdOut.textContent = "Saving…";
      try { await invoke("set_nvd_key", { key }); nvdInput.value = ""; go("settings"); }
      catch (e) { nvdOut.textContent = String(e && e.message ? e.message : e); nvdSave.disabled = false; }
    });
    nvdClear.addEventListener("click", async () => {
      nvdClear.disabled = true; nvdOut.textContent = "Removing…";
      try { await invoke("set_nvd_key", { key: "" }); go("settings"); }
      catch (e) { nvdOut.textContent = String(e && e.message ? e.message : e); nvdClear.disabled = false; }
    });

    const vulndbCard = el("div", { class: "card pad" },
      el("h2", {}, "Vulnerability database"),
      el("p", { class: "secondary" }, "The offline CVE database SLAP matches detected components against. Regenerating pulls the latest advisories from the NIST NVD and replaces your local copy; the new data is used from your next audit, with no restart. It never ships a smaller database than the one it replaces."),
      el("p", {}, "Current: ", vinfoEl),
      el("div", { class: "row-actions", style: "margin-top:8px" }, regenBtn),
      progWrap,
      regenMsg,
      el("p", { class: "muted", style: "margin:16px 0 6px" }, "NVD API key (optional) — ", nvdStatus),
      el("p", { class: "secondary", style: "margin:0 0 8px" }, "A free key from the NVD raises the request rate, cutting a full rebuild from about ten minutes to about ninety seconds. Stored on this machine only and sent only to the NVD."),
      el("div", { style: "margin-bottom:8px" }, nvdInput),
      el("div", { class: "row-actions" }, nvdSave, nvdClear),
      nvdOut);

    // Lighthouse: coverage and what is kept on disk.
    const lhMsg = el("div", { class: "muted", style: "font-size:12px;margin-top:8px" });
    const scopeSel = el("select", { style: "padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)" },
      el("option", { value: "sampled" }, `One page per template (up to ${s.lighthouse_pages_per_site || 5} per site)`),
      el("option", { value: "every_page" }, `Every discovered page (up to ${s.pages_per_site || 20} per site)`));
    scopeSel.value = s.lighthouse_scope || "sampled";
    scopeSel.addEventListener("change", async () => {
      lhMsg.textContent = "Saving…";
      try { await invoke("set_lighthouse_scope", { scope: scopeSel.value }); lhMsg.textContent = "Saved. Used by your next audit with Lighthouse on."; }
      catch (e) { lhMsg.textContent = String(e && e.message ? e.message : e); }
    });
    const keepToggle = el("input", { type: "checkbox" });
    keepToggle.checked = s.keep_lhr !== false;
    keepToggle.addEventListener("change", async () => {
      keepToggle.disabled = true; lhMsg.textContent = "Saving…";
      try {
        await invoke("set_keep_lhr", { enabled: keepToggle.checked });
        lhMsg.textContent = keepToggle.checked
          ? "On — each measured page keeps its full Lighthouse report (about 600 KB)."
          : "Off — only the summary each report is drawn from is kept (a few KB a page).";
      } catch (e) { keepToggle.checked = !keepToggle.checked; lhMsg.textContent = String(e && e.message ? e.message : e); }
      finally { keepToggle.disabled = false; }
    });
    // Speed: how many pages share Chrome at once, and how many runs each gets.
    const lhSpeed = { conc: s.lighthouse_concurrency || 3, runs: s.lighthouse_runs || 3 };
    const lhIntro = el("p", { class: "secondary" });
    const showIntro = () => {
      lhIntro.textContent = `Which pages get the full browser audit when Lighthouse is on. Every page takes up to about ${Math.round(lhSpeed.runs * (s.seconds_per_run || 30) / lhSpeed.conc)} seconds of wall-clock time, ${lhSpeed.conc} at a time, so the every-page mode turns a large batch into an overnight job. New audit shows the exact count and time before anything starts.`;
    };
    showIntro();
    const selStyle = "padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)";
    const pick = (choices, current, label) => {
      const sel = el("select", { style: selStyle });
      // A value set by hand in config.toml that is not one of the choices
      // still shows as itself rather than as the first option.
      if (!choices.some(([v]) => v === current)) choices = [...choices, [current, label(current)]].sort((a, b) => a[0] - b[0]);
      for (const [v, text] of choices) sel.append(el("option", { value: String(v) }, text));
      sel.value = String(current);
      return sel;
    };
    const maxConc = s.lighthouse_max_concurrency || 4;
    const concSel = pick(
      Array.from({ length: maxConc }, (_, i) => i + 1).map(n => [n,
        n === 1 ? "1 page at a time (steadiest scores)"
          : n === 3 ? "3 pages at a time (default)"
          : n === maxConc ? `${n} pages at a time (fastest)`
          : `${n} pages at a time`]),
      lhSpeed.conc, n => `${n} pages at a time`);
    const runsSel = pick([
        [1, "1 run a page (fastest, as PageSpeed Insights does)"],
        [3, "Up to 3 runs a page, middle result (default)"],
        [5, "Up to 5 runs a page, middle result (steadiest)"]],
      lhSpeed.runs, n => `Up to ${n} runs a page, middle result`);
    const saveSpeed = (sel, command, key) => sel.addEventListener("change", async () => {
      const n = Number(sel.value), before = lhSpeed[key];
      sel.disabled = true; lhMsg.textContent = "Saving…";
      try {
        await invoke(command, { n });
        lhSpeed[key] = n; showIntro();
        lhMsg.textContent = "Saved. Used by your next audit with Lighthouse on.";
      } catch (e) { sel.value = String(before); lhMsg.textContent = String(e && e.message ? e.message : e); }
      finally { sel.disabled = false; }
    });
    saveSpeed(concSel, "set_lighthouse_concurrency", "conc");
    saveSpeed(runsSel, "set_lighthouse_runs", "runs");
    const lighthouseCard = el("div", { class: "card pad" },
      el("h2", {}, "Lighthouse"),
      lhIntro,
      el("div", { style: "margin:4px 0 14px" }, scopeSel),
      el("div", { class: "row-actions", style: "margin:0 0 6px" }, concSel, runsSel),
      el("p", { class: "muted", style: "font-size:12.5px;margin:0 0 14px" }, "More pages at a time finishes sooner, but the pages share this computer's processor and the site's server, which lowers their scores; Lighthouse's own advice is one at a time. Each page keeps the middle result of its runs, and stops early once they agree to within 2 points. One run is about three times faster, but a single test can be off by several points."),
      el("label", { class: "seg" }, keepToggle, " Keep each page's full Lighthouse report on disk"),
      el("p", { class: "muted", style: "font-size:12.5px;margin:6px 0 0" }, "Reports are always drawn from a compact per-page summary, so turning this off changes nothing in them. Full reports are for opening in Lighthouse's own viewer, and cost about 1.2 GB per 2,000 pages."),
      lhMsg);

    mount(head, dataCard, lighthouseCard, vulndbCard, brandCard, wpRocketCard, cruxCard);
  } catch (e) { errorView(e); }
}

// -------- router --------
const routes = { sites: viewSites, findings: viewFindings, audit: viewAudit, settings: viewSettings, diagnostics: viewDiagnostics };
function go(route) { if (location.hash !== "#/" + route) location.hash = "#/" + route; else render(); }
function render() {
  const path = (location.hash || "#/sites").slice(2);
  const [head, arg] = path.split("/");
  document.querySelectorAll("nav.side a.item").forEach(a => a.classList.toggle("active", a.dataset.route === head));
  if (head === "site") return viewSite(arg);
  if (head === "run") return viewRun(arg);
  (routes[head] || viewSites)();
}

document.querySelectorAll("nav.side a.item").forEach(a => a.addEventListener("click", () => go(a.dataset.route)));
window.addEventListener("hashchange", render);

(async () => {
  if (hasIPC) {
    try { const s = await invoke("app_status"); document.getElementById("foot").textContent = "SLAP " + s.version; } catch {}
  } else {
    return mount(el("div", { class: "empty" }, el("div", { class: "big" }, "◱"),
      el("p", {}, "This page is the SLAP interface."),
      el("p", { class: "muted" }, "It needs the app shell to reach your data. Open it inside SLAP.")));
  }
  if (!location.hash) location.hash = "#/sites";
  dock.init();
  render();
})();
</script>
</body>
</html>
