# The SLAP app: a cross-platform (Windows, macOS, Linux) desktop app, a Tauri
# shell over a Rust core. This replaced the Python + PyInstaller
# app on 2026-08-27; the assets both eras shared (the findings rules, the
# Node worker, the vulnerability database, the report templates, the
# slowsite fixture) moved in here when the Python tree was retired. Plan
# and phase status: the project doc claude/tauri-rewrite.md.

[workspace]
resolver = "2"
members = ["crates/slap-core", "crates/slap-engine", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Size matters for a desktop app that exists partly to stop being a 400MB
# download. LTO and one codegen unit cost build minutes on release only;
# strip drops the debug info nobody will read out of a teammate's install.
[profile.release]
codegen-units = 1
lto = true
strip = true
