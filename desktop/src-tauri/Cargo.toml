# The shell: a window, IPC commands, and process plumbing. Business logic
# lives in slap-core; anything that grows in here beyond wiring is in the
# wrong crate.

[package]
name = "slap-desktop"
version.workspace = true
edition.workspace = true

# The shell is a library (`run()` plus the command modules) with the binary
# a thin main() over it, which keeps the commands unit-testable. The `_lib`
# suffix keeps the library's link name from colliding with the binary's.
[lib]
name = "slap_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native Save dialog: report exports prompt for a download location rather than
# writing to a fixed directory.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encoding a chosen brand logo into a data: URI for the report branding setting.
base64 = "0.22"
slap-core = { path = "../crates/slap-core" }
# The audit engine: the collectors, the batch runner, the Lighthouse driver,
# and the vulnerability matcher.
slap-engine = { path = "../crates/slap-engine" }
# The audit command drives reqwest on its own current-thread runtime; the
# report commands use `sync` (oneshot) to await the async Save dialog and
# `spawn_blocking` for the Chromium print.
tokio = { version = "1", features = ["rt", "sync"] }

[target."cfg(windows)".dependencies]
# For AttachConsole in --self-check: a windows-subsystem binary has no
# console of its own, and the check's output should still reach a
# developer who ran it from a shell. CI does not rely on this (it pipes,
# which hands the process valid handles), but people type things.
# Win32_System_Power: keeping the machine awake through a long audit
# (SetThreadExecutionState) and the on-battery check (GetSystemPowerStatus).
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
