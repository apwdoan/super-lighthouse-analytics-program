# The shell: a window, IPC commands, and process plumbing. Business logic
# lives in slap-core; anything that grows in here beyond wiring is in the
# wrong crate.

[package]
name = "slap-desktop"
version.workspace = true
edition.workspace = true

# Tauri 2 mobile targets link the app as a library (staticlib on iOS,
# cdylib on Android), with the desktop binary as a thin main() over the
# same `run()`. The `_lib` suffix keeps the library's link name distinct
# from the binary's on platforms where they would otherwise collide.
[lib]
name = "slap_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native Save dialog: report exports prompt for a download location rather than
# writing to a fixed directory.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slap-core = { path = "../crates/slap-core" }
# The audit engine. Desktop-only: the mobile targets build this crate too
# for now, but never call the engine (the viewer has no Run button); if the
# extra compile weight ever matters on mobile it goes behind a feature.
slap-engine = { path = "../crates/slap-engine" }
# The audit command drives reqwest on its own current-thread runtime; the
# report commands use `sync` (oneshot) to await the async Save dialog and
# `spawn_blocking` for the Chromium print.
tokio = { version = "1", features = ["rt", "sync"] }

[target."cfg(windows)".dependencies]
# For AttachConsole in --self-check: a windows-subsystem binary has no
# console of its own, and the check's output should still reach a
# developer who ran it from a shell. CI does not rely on this (it pipes,
# which hands the process valid handles), but people type things.
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
