[project]
name = "slap"
version = "0.1.0"
description = "Super Lighthouse Analytics Project: batch website performance and security auditing"
requires-python = ">=3.11"
dependencies = [
    # The http2, brotli and zstd extras are NOT optional. Without `h2`,
    # httpx negotiates HTTP/1.1 unconditionally and the no-http2 rule fires
    # against sites that are actually on HTTP/2. Without a brotli decoder,
    # the same failure one layer up and quieter: the fetch advertised `br`,
    # wordpress.org obliged, httpx fell back to identity without an error,
    # and every HTML-reading collector analysed 28KB of raw compressed
    # bytes. Zero components on a WordPress site, no error anywhere. A
    # confidently wrong finding in a client report is worse than no
    # finding, and an analysis of bytes that only look like a page is how
    # you get one.
    "httpx[http2,brotli,zstd]>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# PDF export. Playwright ships a pinned Chromium so a client-facing document
# renders identically on every teammate's machine. Needs one setup step:
#     playwright install chromium
report = [
    "playwright>=1.44",
    "pypdf>=4.2",
]
# The web front-end. Jinja2 is already a hard dependency because the report
# is rendered with it, which is most of why a browser UI collapses the
# presentation layer instead of adding a second one.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",   # form posts: the audit box and branding
]
all = [
    "playwright>=1.44",
    "pypdf>=4.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
slap = "slap_web:main"
slap-web = "slap_web:main"   # kept: the old name, for anyone who scripted it

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slap", "src/slap_web"]
# src/slap/data/vulndb.json rides along with the package: it is data the
# code reads at runtime, not a build artifact. Without it an installed copy
# reports zero known vulnerabilities forever and looks clean doing it.
# The Node worker source ships with the package so `slap` can find it, but
# node_modules must not: it is ~90MB of platform-specific files and is
# installed per machine with `npm install --prefix <pkg>/node_worker`.
exclude = ["**/node_modules", "**/package-lock.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["lighthouse: needs the Node Lighthouse worker installed"]
